# Configuração do serviço no Render: Static Site servido direto da pasta ./public.
# O site é criado pelo painel (New + → Static Site, Publish Directory = public); este arquivo
# documenta a mesma configuração e não precisa ser importado. Crie um serviço NOVO,
# não reaproveite o do outro calendário.
services:
  - type: web
    name: calendario-logistica
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      # no-cache: o navegador sempre revalida; junto com o service worker, garante
      # que uma atualização do index.html chegue em todos os dispositivos na hora.
      - path: /*
        name: Cache-Control
        value: no-cache
