<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendário · Logística</title>
<meta name="description" content="Calendário da equipe de Logística">
<meta name="theme-color" content="#23262B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Tema aplicado antes do CSS carregar, senão a tela pisca clara antes de ficar escura. */
try { var t = localStorage.getItem('lg_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/* =====================================================================
   TOKENS — neo-brutalismo suave em chave logística: cinza de concreto,
   tinta grafite (asfalto) e amarelo de carga como destaque. Bordas 1.5px,
   sombra sólida deslocada, cantos 6px, botões pílula.
   ===================================================================== */
:root{
  --paper:#F3F3F0; --paper-2:#E4E4DF; --card:#FFFFFF;
  --ink:#23262B; --ink-2:#4C525A; --muted:#7C838C;
  --line:#23262B; --accent:#F2B01E; --danger:#C4553D; --ok:#3E8F5E; --warn:#E0A72E;
  --todos:#23262B; --todos-ink:#F3F3F0;
  --shadow:2px 2px 0 var(--ink); --shadow-lg:4px 4px 0 var(--ink);
  --r:6px; --bw:1.5px; --border:var(--bw) solid var(--line);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-serif:'Fraunces','Georgia','Times New Roman',serif;
  --sidebar-w:300px; --hour-h:48px; --top-h:60px;
  /* profundidade e inclinação dos cubos do mês */
  --cube-d:16px; --cube-edge:#C6C6BC; --cube-edge-2:#ADADA3;
}
[data-theme="dark"]{
  --paper:#191C20; --paper-2:#22262B; --card:#2A2F35;
  --ink:#F0F0EA; --ink-2:#CBD0D6; --muted:#959BA4;
  --line:#F0F0EA; --todos:#F0F0EA; --todos-ink:#191C20;
  --accent:#F2B01E; --danger:#E07A63; --ok:#5FBE86; --warn:#E8B94A;
  --cube-edge:#1C2025; --cube-edge-2:#12151A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body.modal-open,body.drawer-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:12px} .right{margin-left:auto} .flex1{flex:1;min-width:0}
.mt{margin-top:10px} .mb{margin-bottom:10px} .center{text-align:center}
.serif{font-family:var(--font-serif)} .italic{font-style:italic}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.01em}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:var(--border);border-radius:999px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-weight:600;font-size:13px;line-height:1.2;transition:transform .08s,box-shadow .08s;white-space:nowrap;text-decoration:none;position:relative}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-accent{background:var(--accent);color:#23262B}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{box-shadow:none;background:transparent}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:2px 8px;font-size:11px}
.btn-block{width:100%;justify-content:center}
.btn.on{background:var(--ink);color:var(--paper)}
.iconbtn{position:relative;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:16px;padding:0;flex-shrink:0;transition:transform .08s,box-shadow .08s}
.iconbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.iconbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--paper);line-height:1}
.badge:empty{display:none}

/* ---------- campos ---------- */
.input,select,textarea{width:100%;padding:8px 10px;border:var(--border);border-radius:var(--r);background:var(--card);color:var(--ink);outline:none;font-size:14px}
.input:focus,select:focus,textarea:focus{box-shadow:var(--shadow)}
input[type=color]{width:44px;height:34px;padding:2px;border:var(--border);border-radius:var(--r);background:var(--card);cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--ink);width:16px;height:16px}
textarea{min-height:72px;resize:vertical;line-height:1.4}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field>label{font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.warn-box{border:var(--border);border-left-width:6px;border-left-color:var(--warn);background:var(--paper-2);padding:8px 10px;border-radius:var(--r);font-size:13px;margin:8px 0}
.ok-box{border:var(--border);border-left-width:6px;border-left-color:var(--ok);background:var(--paper-2);padding:8px 10px;border-radius:var(--r);font-size:13px;margin:8px 0}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.toggle input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border:var(--border);border-radius:999px;position:relative;background:var(--card);cursor:pointer;margin:0;flex-shrink:0}
.toggle input::after{content:'';position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:19px}

/* ---------- header ---------- */
.demo-bar{background:var(--warn);color:#23262B;text-align:center;font-size:12px;font-weight:700;padding:4px 10px}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:9px;border:var(--border);flex-shrink:0}
.month-title{font-family:var(--font-serif);font-size:28px;font-weight:600;line-height:1;letter-spacing:-.01em;white-space:nowrap;text-transform:capitalize}
.month-title span{font-style:italic;font-weight:400;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.seg{display:inline-flex;border:var(--border);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.online{width:12px;height:12px;border-radius:50%;background:var(--ok);border:var(--border);box-shadow:var(--shadow);margin-left:6px;flex-shrink:0}
.online.off{background:var(--danger)}
.online.sync{background:var(--warn)}

/* ---------- banner ---------- */
.banner{display:grid;grid-template-columns:1.1fr 1.5fr .9fr;gap:10px;padding:10px 16px;border-bottom:var(--border);background:var(--paper-2)}
.banner-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);min-width:0}
.banner-item .big{font-size:24px;flex-shrink:0}
.banner-item .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.banner-item .val{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.banner-item.clickable{cursor:pointer}
.banner-item.clickable:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.quote{font-family:var(--font-serif);font-style:italic;font-size:14px;line-height:1.3}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;align-items:start}
/* Sticky sem teto de altura: gruda no topo enquanto rola, mas nunca esconde
   conteudo atras de um limite invisivel. Quando o menu e mais alto que o mes
   (equipe, proximos compromissos, resumo, mural de elogios somados), a pagina
   toda fica mais alta e um scroll normal mostra tudo - sem barra escondida
   dentro de uma coluna estreita que parecia "cortar" os botoes de baixo. */
.sidebar{border-right:var(--border);padding:14px;background:var(--paper);position:sticky;top:var(--top-h)}
.content{padding:14px 16px;min-width:0;overflow-x:clip}
.hamb{display:none}
.drawer-backdrop{display:none}

/* ---------- sidebar ---------- */
.sb-section{margin-bottom:16px}
.sb-title{font-family:var(--font-serif);font-size:16px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.userbox{display:flex;align-items:center;gap:10px;padding:10px;border:var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.userbox .nm{font-weight:700;font-family:var(--font-serif);font-size:17px;line-height:1.1}
.avatar{width:40px;height:40px;border-radius:50%;border:var(--border);object-fit:cover;background:var(--paper-2);flex-shrink:0;display:block}
.avatar.sm{width:28px;height:28px}
.avatar.xs{width:20px;height:20px;border-width:1px}
.avatar.lg{width:64px;height:64px}
.role-tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:1px 6px;border:1px solid var(--ink);border-radius:999px;display:inline-block}
.sb-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-btns .btn{justify-content:center}

/* Marcador de proximidade nos botões de ação do menu (adaptação do padrão
   "linha que cresce perto do ponteiro" de navegação por lista, aqui aplicado
   a uma grade 2x2 em vez de uma lista vertical): uma linha embaixo do botão
   cresce e clareia conforme o ponteiro se aproxima. --fx (0 a 1) é escrito
   pelo JS a cada quadro, suavizado por interpolação exponencial, então cor,
   escala e opacidade se movem juntos sem depender de transição CSS.  */
.sb-btns .btn{--fx:0;position:relative;overflow:hidden}
.sb-btns .btn::after{content:'';position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:1px;background:var(--accent);transform-origin:left center;transform:scaleX(calc(.1 + var(--fx) * .9));opacity:calc(.3 + var(--fx) * .7);pointer-events:none}
@supports (color:color-mix(in srgb,red,blue)){
  .sb-btns .btn{border-color:color-mix(in srgb, var(--accent) calc(var(--fx) * 70%), var(--line))}
}
@media (prefers-reduced-motion:reduce){.sb-btns .btn::after{display:none}}
.team-item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:var(--r);cursor:pointer}
.team-item:hover{background:var(--paper-2)}
.team-item .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-item .st{font-size:11px;color:var(--muted);white-space:nowrap}
.color-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);flex-shrink:0;display:inline-block}
.upc-item{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:var(--border);border-radius:var(--r);margin-bottom:6px;cursor:pointer;background:var(--bg,var(--card));color:var(--fg,var(--ink))}
.upc-item:hover{box-shadow:var(--shadow)}
.upc-item .when{font-size:11px;opacity:.8;white-space:nowrap}
.upc-item .t{font-weight:600;font-size:13px;line-height:1.25}
.summary-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.summary-row .nm{width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.summary-row .bar{flex:1;height:12px;border:var(--border);border-radius:4px;background:var(--card);overflow:hidden}
.summary-row .bar>i{display:block;height:100%;background:var(--bg,var(--ink))}
.summary-row .n{width:22px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kudo{padding:8px 10px;border:var(--border);border-radius:var(--r);background:var(--card);margin-bottom:6px;font-size:13px;box-shadow:var(--shadow)}
.kudo .meta{font-size:11px;color:var(--muted);margin-top:3px}
.status-picker{display:flex;flex-wrap:wrap;gap:4px}
.status-picker .btn{padding:4px 8px;font-size:12px;box-shadow:none}
.search-wrap{position:relative}
.search-results{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);max-height:260px;overflow:auto;margin-top:4px}
.search-results div{padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--paper-2)}
.search-results div:hover{background:var(--paper-2)}

/* ---------- vista mês ---------- */
.view-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.view-head h2{margin:0;font-size:20px}
/* A grade do mês é a "cena 3D": cada dia é um caixote que se inclina perto do
   ponteiro, como carga numa prateleira. O fundo da grade é o papel (não a
   tinta): assim, quando um bloco se inclina, aparece o fundo limpo por trás em
   vez de emendas escuras quebradas. Cada dia carrega a própria borda. */
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:var(--border);border-radius:var(--r);background:var(--paper-2);gap:3px;padding:3px;box-shadow:var(--shadow-lg)}
.month-grid.cubes-on{perspective:900px;perspective-origin:50% 45%}
.dow{background:transparent;padding:6px 6px 8px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);border-bottom:2.5px solid var(--accent);margin-bottom:2px}
.cell{background:var(--card);border:var(--border);border-radius:3px;min-height:120px;padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;min-width:0}
.cell:hover{background:var(--paper-2)}
.cubes-on .cell{transform-style:preserve-3d;transition:transform .55s cubic-bezier(.16,1,.3,1)}
.cubes-on .cell:hover{background:var(--card)}   /* a inclinação já é o retorno visual */
.cubes-on .cell.other:hover{background:var(--paper)}
.cubes-on .cell.tilting{transition-duration:.18s}
/* Espessura do caixote. A inclinação é rotateX(-a) rotateY(+a): isso joga a
   borda direita e a de baixo para trás, então as faces que ficam à vista são a
   ESQUERDA e a de CIMA — é onde elas têm de estar. Tons mais escuros que a
   frente, que é o que faz o olho ler volume. */
.cubes-on .cell::after{content:'';position:absolute;top:calc(var(--bw) * -1);left:calc(var(--bw) * -1);width:var(--cube-d);height:calc(100% + var(--bw) * 2);background:var(--cube-edge);border:var(--border);border-right:0;transform-origin:0 50%;transform:rotateY(90deg);pointer-events:none}
.cubes-on .cell::before{content:'';position:absolute;left:calc(var(--bw) * -1);top:calc(var(--bw) * -1);width:calc(100% + var(--bw) * 2);height:var(--cube-d);background:var(--cube-edge-2);border:var(--border);border-bottom:0;transform-origin:50% 0;transform:rotateX(-90deg);pointer-events:none}
/* onda ao clicar: anéis de dias acendem em amarelo, saindo do dia clicado */
.cube-flash{position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none;border-radius:2px}
.cell.ripple .cube-flash{animation:cubeFlash .5s ease-out var(--ripple-delay,0ms) both}
@keyframes cubeFlash{0%{opacity:0}30%{opacity:.5}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .cubes-on .cell{transition:none;transform:none!important}
  .cell.ripple .cube-flash{animation:none}
}
.cell.other{background:var(--paper);color:var(--muted)}
.cell.other .ev{opacity:.7}
.cell.hol .daynum .n{color:var(--danger)}
.cell.today{border-color:var(--accent);border-width:2.5px}
.cell.today .daynum .n{background:var(--accent);color:#23262B}
.daynum{display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px;min-width:0}
.daynum .n{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.daynum .hol{font-size:10px;color:var(--danger);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
/* Marca da nota pessoal no canto do dia (só quem escreveu enxerga a própria):
   uma pastinha que levanta, abre a aba e deixa a folha subir quando o ponteiro
   passa pelo dia — mecânica da pasta do reactbits.dev, reduzida a 26px. O ícone
   fica numa camada própria e nunca se deforma: quem inclina é a superfície
   colorida atrás dele, senão o emoji sairia amassado. */
.note-fold{--nc:var(--muted);position:relative;margin-left:auto;width:26px;height:20px;flex-shrink:0;transition:transform .25s ease-out}
.note-fold::before{content:'';position:absolute;inset:0;background:var(--nc);border:1px solid var(--ink);border-radius:1px 4px 4px 4px}
.note-fold::after{content:'';position:absolute;left:0;bottom:100%;width:11px;height:3px;background:var(--nc);border:1px solid var(--ink);border-bottom:0;border-radius:2px 2px 0 0}
.note-fold__paper{position:absolute;z-index:1;bottom:2px;left:50%;width:68%;height:74%;background:var(--card);border:1px solid var(--ink);border-radius:2px;transform:translate(-50%,18%);transition:transform .3s ease-in-out}
.note-fold__front{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;line-height:1;transition:transform .3s ease-in-out}
.note-fold__front::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--nc);border:1px solid var(--ink);border-radius:1px 4px 4px 4px;transform-origin:bottom;transition:transform .3s ease-in-out}
.cell:hover .note-fold{transform:translateY(-3px)}
.cell:hover .note-fold__front{transform:translateY(-2px)}
.cell:hover .note-fold__front::before{transform:skewX(12deg) scaleY(.55)}
.cell:hover .note-fold__paper{transform:translate(-50%,-46%)}
@media (prefers-reduced-motion:reduce){
  .note-fold,.note-fold__paper,.note-fold__front,.note-fold__front::before{transition:none}
  .cell:hover .note-fold,.cell:hover .note-fold__front,.cell:hover .note-fold__front::before,.cell:hover .note-fold__paper{transform:none}
  .cell:hover .note-fold__paper{transform:translate(-50%,18%)}
}
/* dia com nota colorida: fundo tingido e borda na cor, pra achar de longe */
.cell.com-nota{border-color:var(--nc);border-width:2px}
@supports (color:color-mix(in srgb,red,blue)){
  .cell.com-nota{background:color-mix(in srgb, var(--nc) 15%, var(--card))}
  .cell.com-nota:hover{background:color-mix(in srgb, var(--nc) 24%, var(--card))}
  .cell.com-nota.other{background:color-mix(in srgb, var(--nc) 10%, var(--paper))}
}
.cell.today.com-nota{border-color:var(--accent)}   /* hoje continua mandando na borda */

/* escolha da cor da nota */
.color-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.color-pick button{width:28px;height:28px;border:var(--border);border-radius:50%;background:var(--sw,var(--card));cursor:pointer;padding:0;position:relative}
.color-pick button.nenhuma::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:2px;background:var(--danger);transform:rotate(-45deg)}
.color-pick button.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.color-pick .outra{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 3px;border:var(--border);border-radius:999px;cursor:pointer;font-size:11px;font-weight:600;background:var(--card)}
.color-pick .outra input{width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer}
.color-pick .outra.on{box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:2px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border:1px solid var(--ink);border-radius:999px;background:var(--bg,var(--paper-2));color:var(--fg,var(--ink));white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 5px;border:1px solid var(--ink);border-radius:4px;background:var(--bg,var(--card));color:var(--fg,var(--ink));cursor:pointer;overflow:hidden;white-space:nowrap;box-shadow:1px 1px 0 var(--ink);line-height:1.3;min-width:0}
.ev:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.ev .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .hh{opacity:.85;font-variant-numeric:tabular-nums;flex-shrink:0;font-size:10px}
.ev .ico{flex-shrink:0}
.ev.done{opacity:.55}
.ev.done .t{text-decoration:line-through}
.ev.pin{border-width:2px}
.more{font-size:11px;color:var(--muted);font-weight:700;padding:0 4px}

/* ---------- linha do tempo (semana / dia) ---------- */
.tl{border:var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-lg);overflow:hidden;--cols:7}
.tl-head,.tl-allday,.tl-body{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr))}
.tl-head,.tl-allday{padding-right:var(--sbw,0px)}
.tl-head{border-bottom:var(--border);background:var(--paper-2)}
.tl-head>div{padding:6px 4px;text-align:center;font-size:11px;font-weight:700;border-left:1px solid var(--ink);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;min-width:0}
.tl-head>div:first-child{border-left:0;cursor:default}
.tl-head>div.today{background:var(--accent);color:#23262B}
.tl-head .dnum{font-family:var(--font-serif);font-size:18px;display:block;text-transform:none;letter-spacing:0}
.tl-head .hol{display:block;font-size:9px;color:var(--danger);text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-head>div.today .hol{color:#23262B}
.tl-allday{border-bottom:var(--border);min-height:34px}
.tl-allday>div{padding:3px;border-left:1px solid var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.tl-allday>div:first-child{border-left:0;font-size:10px;color:var(--muted);align-items:center;justify-content:center;text-transform:uppercase;font-weight:700}
.tl-body{max-height:calc(100vh - 300px);overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-gutter:stable}
.tl-hours{display:flex;flex-direction:column}
.tl-hours div{height:var(--hour-h);font-size:11px;color:var(--muted);text-align:right;padding:2px 6px 0 0;font-variant-numeric:tabular-nums}
.tl-col{position:relative;border-left:1px solid var(--ink);background-image:linear-gradient(to bottom,var(--paper-2) 1px,transparent 1px);background-size:100% var(--hour-h);cursor:pointer;min-width:0}
.tl-col.today{background-color:rgba(242,176,30,.10)}
.tl-ev{position:absolute;border:1px solid var(--ink);border-radius:4px;padding:3px 6px;font-size:11px;overflow:hidden;background:var(--bg,var(--card));color:var(--fg,var(--ink));box-shadow:1px 1px 0 var(--ink);cursor:pointer;line-height:1.25;min-width:0}
.tl-ev:hover{z-index:3;box-shadow:2px 2px 0 var(--ink)}
.tl-ev .t{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-ev .hh{opacity:.85;font-size:10px}
.tl-now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.tl-now::before{content:'';position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.day-extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* ---------- modais ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(35,38,43,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:var(--paper);border:var(--border);border-radius:8px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;margin:auto 0;animation:pop .12s ease-out}
.modal.wide{max-width:980px}
.modal.narrow{max-width:460px}
@keyframes pop{from{transform:translateY(6px);opacity:.5}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:var(--border);position:sticky;top:0;background:var(--paper);z-index:2;border-radius:8px 8px 0 0}
.modal-head h2{font-size:22px;margin:0;line-height:1.15;flex:1;min-width:0}
.modal-head .sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:400;font-family:var(--font-ui)}
.modal-body{padding:14px 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 12px;border:var(--border);border-radius:999px;background:var(--card);cursor:pointer;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.tab.on{background:var(--ink);color:var(--paper)}
.tabpane{display:none}
.tabpane.on{display:block}
.section{border:var(--border);border-radius:var(--r);background:var(--card);padding:12px;margin-bottom:12px}
.section h3{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.section h3 .right{font-family:var(--font-ui);font-size:12px;font-weight:600}
.list-ev{display:flex;flex-direction:column;gap:6px}
.list-ev .item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:var(--border);border-radius:var(--r);cursor:pointer;background:var(--bg,var(--card));color:var(--fg,var(--ink))}
.list-ev .item:hover{box-shadow:var(--shadow)}
.list-ev .item .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-ev .item .hh{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);font-style:italic;font-family:var(--font-serif);padding:8px 0;font-size:14px}
.person-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;border:1px solid var(--ink);border-radius:999px;font-size:12px;font-weight:600;background:var(--bg,var(--paper-2));color:var(--fg,var(--ink));white-space:nowrap}
.person-chip.todos{background:var(--todos);color:var(--todos-ink)}
.task-row{display:grid;grid-template-columns:1.1fr .8fr 1.5fr auto;gap:6px;align-items:start;margin-bottom:8px;padding:8px;border:1px solid var(--ink);border-radius:var(--r);background:var(--paper-2)}
.task-row .role-wrap{grid-column:1/-1}
.role-chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 0}
.role-chips .chip{cursor:pointer;font-size:11px;padding:3px 8px;background:var(--card)}
.role-chips .chip:hover,.role-chips .chip.on{background:var(--ink);color:var(--paper)}
.templates{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.task-list{display:flex;flex-direction:column;gap:4px}
.task-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--ink);border-radius:var(--r);background:var(--card);font-size:13px}
.task-item.done{opacity:.6}
.task-item.done .tx{text-decoration:line-through}
.task-item input[type=checkbox]{width:18px;height:18px;flex-shrink:0}
.task-item .tx{flex:1;min-width:0}
.task-item .meta{font-size:11px;color:var(--muted);white-space:nowrap}
.rsvp-btns{display:flex;gap:6px;flex-wrap:wrap}
.rsvp-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.comment{padding:8px 10px;border:1px solid var(--ink);border-radius:var(--r);background:var(--card);margin-bottom:6px;font-size:13px}
.comment .meta{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:6px}
.mention{background:var(--accent);color:#23262B;padding:0 3px;border-radius:3px;font-weight:600}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 0}
.ev-meta span{display:inline-flex;align-items:center;gap:4px}
.ev-desc{white-space:pre-wrap;font-size:13px;line-height:1.5}
.req-item{padding:10px;border:var(--border);border-radius:var(--r);background:var(--card);margin-bottom:8px;font-size:13px}
.req-item .st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.st.pendente{color:var(--warn)} .st.aceita{color:var(--ok)} .st.recusada{color:var(--danger)}
.msg-layout{display:grid;grid-template-columns:200px 1fr;gap:10px;min-height:380px}
.msg-people{border:var(--border);border-radius:var(--r);background:var(--card);overflow:auto;padding:4px}
.msg-people .team-item.on{background:var(--ink);color:var(--paper)}
.msg-people .team-item.on .st{color:var(--paper)}
.msg-thread{display:flex;flex-direction:column;border:var(--border);border-radius:var(--r);background:var(--card);min-height:380px}
.msg-scroll{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:380px}
.bubble{max-width:82%;padding:6px 10px;border:1px solid var(--ink);border-radius:10px;font-size:13px;background:var(--paper-2);align-self:flex-start;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--accent);color:#23262B}
.bubble .meta{font-size:10px;opacity:.7;margin-top:2px}
.msg-input{display:flex;gap:6px;padding:8px;border-top:var(--border)}
.bar-row{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:6px}
.bar-row .bar{height:18px;border:var(--border);border-radius:4px;background:var(--card);overflow:hidden}
.bar-row .bar>i{display:block;height:100%;background:var(--bg,var(--ink));border-right:var(--border);border-radius:0 4px 4px 0;min-width:2px}
.bar-row .bar>i.zero{display:none}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat div{border:var(--border);border-radius:var(--r);padding:8px 4px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--card)}
.heat div b{display:block;font-size:18px;font-family:var(--font-serif);text-transform:none;letter-spacing:0}
.hist-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--paper-2);font-size:13px;align-items:flex-start}
.hist-item .when{color:var(--muted);font-size:11px;white-space:nowrap;min-width:96px;padding-top:2px}
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.tile{border:var(--border);border-radius:var(--r);background:var(--card);padding:10px;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--font-serif);font-size:26px;line-height:1;font-weight:600}
.tile span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{border:1px solid var(--ink);padding:6px 8px;text-align:left}
.table th{background:var(--paper-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.wx-card{border:var(--border);border-radius:var(--r);background:var(--card);padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}
.wx-now{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.wx-now .big{font-size:40px}
.wx-now .temp{font-family:var(--font-serif);font-size:32px;font-weight:600;line-height:1}
.wx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.wx-days div{text-align:center;font-size:11px;border:1px solid var(--ink);border-radius:var(--r);padding:6px 2px;background:var(--paper-2)}
.wx-days .i{font-size:20px;display:block}
.people-pick{display:flex;flex-wrap:wrap;gap:6px}
.people-pick label{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border:var(--border);border-radius:999px;cursor:pointer;background:var(--card);font-weight:600;font-size:13px}
.people-pick label.on{background:var(--ink);color:var(--paper)}
.icon-pick{display:flex;flex-wrap:wrap;gap:4px}
.icon-pick button{width:34px;height:34px;border:var(--border);border-radius:var(--r);background:var(--card);cursor:pointer;font-size:17px;padding:0}
.icon-pick button.on{background:var(--ink)}
.prio-alta{color:var(--danger)} .prio-media{color:var(--warn)} .prio-baixa{color:var(--ok)}
.block-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--ink);border-radius:var(--r);background:var(--card);margin-bottom:4px;font-size:13px}
.team-edit{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding:12px;border:var(--border);border-radius:var(--r);background:var(--card);margin-bottom:10px}
.team-edit.inactive{opacity:.6}
.diary-hist{display:flex;flex-wrap:wrap;gap:4px}
.diary-hist .btn{font-weight:500}
.wc{font-size:11px;color:var(--muted);text-align:right}
.note-view{padding:10px;border:var(--border);border-radius:var(--r);background:var(--card);font-size:13px;white-space:pre-wrap}

/* ---------- toast / fx / login ---------- */
.toast-wrap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;border:var(--border);box-shadow:2px 2px 0 var(--accent);font-weight:600;font-size:13px;animation:pop .15s;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{box-shadow:2px 2px 0 var(--ok)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.login-screen{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login-card{width:100%;max-width:400px;border:var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow-lg);padding:24px;text-align:center;margin:auto}
.login-card img{width:72px;height:72px;border-radius:16px;border:var(--border);box-shadow:var(--shadow)}
.login-card h1{font-size:30px;margin:10px 0 2px}
.login-card .sub{font-family:var(--font-serif);font-style:italic;color:var(--muted);margin-bottom:14px}
.pin-boxes{display:flex;gap:8px;justify-content:center;margin:14px 0;cursor:text}
.pin-boxes span{width:48px;height:56px;border:var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;background:var(--paper);box-shadow:var(--shadow)}
.pin-boxes span.on{border-width:2.5px}
.pin-hidden{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto}
.keypad .btn{justify-content:center;font-size:18px;padding:10px;border-radius:var(--r)}
.login-msg{min-height:20px;font-size:13px;margin-top:10px;font-weight:600}
.login-msg.err{color:var(--danger)}
.login-msg.ok{color:var(--ok)}
.demo-people{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.demo-people .btn{justify-content:flex-start}

/* ---------- responsivo ---------- */
@media (max-width:1100px){
  .banner{grid-template-columns:1fr 1fr}
  .banner-item:nth-child(2){grid-column:1/-1}
}
@media (max-width:900px){
  .hamb{display:inline-flex}
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);z-index:150;transform:translateX(-105%);transition:transform .2s;overflow-y:auto;box-shadow:var(--shadow-lg);padding-top:16px}
  .sidebar.open{transform:none}
  .drawer-backdrop.show{display:block;position:fixed;inset:0;background:rgba(35,38,43,.5);z-index:140}
  .banner{grid-template-columns:1fr;padding:8px 10px}
  .topbar{padding:8px 10px;gap:8px}
  .month-title{font-size:20px}
  .clock{display:none}
  .nav{margin-left:0;width:100%;justify-content:space-between}
  .tools{width:100%;justify-content:flex-start}
  .tools .iconbtn{width:32px;height:32px;font-size:14px}
  .content{padding:10px 8px}
  .cell{min-height:84px;padding:2px}
  .ev .hh{display:none}
  .ev{font-size:10px;padding:1px 3px}
  .daynum .hol{display:none}
  .cell .chip{font-size:9px;padding:0 4px;gap:2px}
  .cell .chips{gap:1px}
  .msg-layout{grid-template-columns:1fr;min-height:0}
  .msg-people{max-height:130px}
  .task-row{grid-template-columns:1fr 1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .day-extra{grid-template-columns:1fr}
  .modal-backdrop{padding:10px 6px}
  .modal-head h2{font-size:19px}
  .tl-body{max-height:none}
  .bar-row{grid-template-columns:80px 1fr 32px}
}

/* ---------- impressão ---------- */
@media print{
  .topbar .nav,.topbar .tools,.banner,.sidebar,.hamb,.toast-wrap,#fx,.modal-backdrop,.login-screen,.demo-bar,.drawer-backdrop{display:none!important}
  .topbar{position:static;border:0}
  .layout{display:block}
  .content{padding:0}
  .month-grid,.tl,.ev,.tl-ev{box-shadow:none}
  .cell{transform:none!important}
  .cubes-on .cell::before,.cubes-on .cell::after,.cube-flash{display:none}
  .month-grid.cubes-on{perspective:none}
  body{background:#fff;color:#000}
  .cell{min-height:96px;break-inside:avoid}
  .tl-body{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<div id="demo-bar" class="demo-bar" hidden>Modo demonstração — sem Firebase. Os dados ficam só neste navegador. Veja SETUP-FIREBASE.md para publicar de verdade.</div>

<header class="topbar" id="topbar">
  <button class="iconbtn hamb" data-act="drawer" aria-label="Abrir menu">☰</button>
  <div class="brand">
    <img src="logo.png" alt="Logística">
    <div>
      <div class="month-title" id="month-title">—</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>
  <div class="nav">
    <button class="btn btn-sm" data-act="prev" aria-label="Anterior">←</button>
    <button class="btn btn-sm" data-act="today">Hoje</button>
    <button class="btn btn-sm" data-act="next" aria-label="Próximo">→</button>
    <div class="seg" id="view-seg">
      <button data-act="view" data-view="month" class="on">Mês</button>
      <button data-act="view" data-view="week">Semana</button>
      <button data-act="view" data-view="day">Dia</button>
    </div>
  </div>
  <div class="tools">
    <button class="iconbtn" data-act="team-status" title="Status da equipe hoje" aria-label="Status da equipe">👥</button>
    <button class="iconbtn" data-act="insights" title="Insights do mês" aria-label="Insights">📊</button>
    <button class="iconbtn" data-act="history" title="Histórico de ações" aria-label="Histórico">🕘</button>
    <button class="iconbtn" data-act="requests" title="Solicitações" aria-label="Solicitações">📨<span class="badge" id="badge-req"></span></button>
    <button class="iconbtn" data-act="theme" id="btn-theme" title="Tema claro/escuro" aria-label="Tema">🌙</button>
    <button class="iconbtn" data-act="prefs" title="Preferências" aria-label="Preferências">⚙️</button>
    <button class="iconbtn" data-act="print" title="Imprimir / PDF" aria-label="Imprimir">🖨️</button>
    <button class="iconbtn" data-act="backup" title="Backup JSON" aria-label="Backup">💾</button>
    <span class="online" id="online-dot" title="Online"></span>
  </div>
</header>

<div class="banner">
  <div class="banner-item clickable" data-act="banner-next" id="banner-next">
    <span class="big">📌</span>
    <div class="flex1"><div class="lbl">Próximo compromisso</div><div class="val" id="next-val">—</div></div>
  </div>
  <div class="banner-item">
    <span class="big">💬</span>
    <div class="flex1"><div class="lbl">Frase do dia</div><div class="quote" id="quote">—</div></div>
  </div>
  <div class="banner-item clickable" data-act="weather" id="banner-weather" title="Ver previsão de todas as cidades">
    <span class="big" id="wx-ico">🌤️</span>
    <div class="flex1"><div class="lbl">Clima</div><div class="val" id="wx-val">carregando…</div></div>
  </div>
</div>

<div class="layout">

function relTime(date) {
  const diff = date - Date.now(), min = Math.round(diff / 6e4);

function hexToRgb(hex) {
  const h = String(hex || '#888888').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function luminance(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

async function sha256(text) {
  if (!(window.crypto && crypto.subtle)) throw new Error('Este navegador não suporta SHA-256 (precisa de HTTPS).');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Texto de comentário: escapa tudo e só depois realça as menções @nome.
function richText(text) {
  return esc(text).replace(/(^|\s)@([\wÀ-ÿ]+)/g, (m, pre, name) => `${pre}<span class="mention">@${name}</span>`);
}
/* O nome da pessoa é texto livre e entrava cru numa expressão regular. Um nome
 * como "Rosilene (turno 2" gerava um padrão inválido, e o erro estourava dentro
 * do onSnapshot: a sincronia em tempo real morria em todos os aparelhos, sem
 * aviso, até alguém recarregar. Aqui os caracteres especiais são neutralizados. */
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function mentions(text, key) {
  const p = getEquipe()[key]; if (!p) return false;
  try {
    const re = new RegExp(`@(${escRe(key)}|${escRe(norm(p.nome))})\\b`, 'i');
    return re.test(norm(text));
  } catch (e) { return false; }
}

/* =====================================================================
 * 4. ESTADO, SESSÃO E PREFERÊNCIAS LOCAIS
 * Tema e modo festivo são por dispositivo (localStorage) e não sincronizam.
 * ===================================================================== */
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : v; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

const state = clone(DEFAULTS);
const session = { user: null };
const ui = {
  view: 'month', cursor: new Date(), onlyMine: false, search: '',
  theme: document.documentElement.getAttribute('data-theme') || 'light',
  festivo: lsGet('lg_festivo', '1') === '1',
  cubes: lsGet('lg_cubes', '1') === '1',   // blocos 3D na grade do mês
  weekStart: Number(lsGet('lg_weekStart', '0')) || 0,
  ready: false, online: navigator.onLine, firstSnapshot: true,
  geo: null,          // { lat, lon, name, admin } quando a pessoa autoriza a localização
  modals: []
};

/* =====================================================================
 * 5. PERSISTÊNCIA — Firestore é a fonte da verdade, localStorage é cache.
 * Cada chave do estado = um documento logisticaData/<chave>, com o JSON
 * stringificado em "value". Leitura cai pro cache se o Firestore falhar.
 * Gravação: se falhar OU demorar demais (o SDK offline simplesmente
 * segura a promise, sem rejeitar), a chave entra na offlineQueue.
 * ===================================================================== */
let db = null, auth = null, secondaryApp = null;
const HAS_FIREBASE = !DEMO && typeof firebase !== 'undefined';
if (HAS_FIREBASE) {
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); auth = firebase.auth(); }
  catch (e) { console.error('Firebase não inicializou', e); }
}
/* O modo demonstração guarda em outro lugar. Antes ele lia o mesmo cache da
 * sessão real, então abrir a página com ?demo mostrava diário, mensagens e
 * eventos privados de quem tinha usado o aparelho, sem pedir PIN. */
const CACHE_PREFIX = DEMO ? 'lgdemo_data_' : 'lg_data_';
const cache = { get: k => lsGet(CACHE_PREFIX + k, null), set: (k, v) => lsSet(CACHE_PREFIX + k, v) };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

window.storage = {
  async get(key) {
    if (!db) return cache.get(key);
    try {
      const snap = await withTimeout(db.collection(COLLECTION).doc(key).get(), 8000);
      if (snap.exists) { const v = snap.data().value; cache.set(key, v); return v; }
      return cache.get(key);
    } catch (e) { return cache.get(key); }
  },
  async set(key, value) {
    const str = typeof value === 'string' ? value : JSON.stringify(value);
    if (typeof str !== 'string') return false;   // JSON.stringify(undefined) não devolve string
    cache.set(key, str);
    if (!db) return true;
    try {
      await withTimeout(gravarDoc(key, str), 8000);
      queueRemove(key); setOnline(true); return true;
    } catch (e) {
      // permissão negada não é "offline": avisar e não enfileirar, senão fica tentando pra sempre
      if (e && e.code === 'permission-denied') { toast('Sem permissão para salvar. Entre de novo.', 'err'); return false; }
      queueAdd(key, str);
      // tempo esgotado não prova que a rede caiu; só o navegador sabe disso
      setOnline(navigator.onLine ? 'sync' : false);
      return false;
    }
  }
};
const gravarDoc = (key, str) => db.collection(COLLECTION).doc(key).set({ value: str, updatedAt: Date.now(), updatedBy: session.user || null });

/* Fila offline no formato { chave: json }. Guardar O VALOR, e não só a chave, é
 * o que garante que a edição feita sem sinal seja a que sobe depois. Antes a
 * fila reenviava state[chave]: se o primeiro snapshot já tivesse trazido o dado
 * do servidor, ela regravava esse mesmo dado por cima e ainda avisava
 * "sincronizado", com a alteração da pessoa perdida sem aviso. */
function getQueue() {
  try { const q = JSON.parse(lsGet('offlineQueue', '{}')); return (q && typeof q === 'object' && !Array.isArray(q)) ? q : {}; }
  catch (e) { return {}; }
}
function queueAdd(key, str) { const q = getQueue(); q[key] = str; lsSet('offlineQueue', JSON.stringify(q)); }
function queueRemove(key) { const q = getQueue(); delete q[key]; lsSet('offlineQueue', JSON.stringify(q)); }
let flushing = false;
async function flushQueue() {
  const q = getQueue(), chaves = Object.keys(q);
  if (!chaves.length || flushing || !db || !session.user) return;
  flushing = true; setOnline('sync');
  let enviadas = 0;
  for (const key of chaves) {
    try { await withTimeout(gravarDoc(key, q[key]), 8000); queueRemove(key); enviadas++; }
    catch (e) {
      /* Sem permissão nunca vai passar. Ficando na fila, essa chave barrava
       * todas as outras e o ciclo de 30 s tentava de novo pra sempre: a fila
       * nunca esvaziava e nada mais subia. Descarta e segue. */
      if (e && e.code === 'permission-denied') { queueRemove(key); toast('Sem permissão para salvar. Entre de novo.', 'err'); continue; }
      break;   // ainda sem caminho: para aqui e tenta no próximo ciclo
    }
  }
  flushing = false;
  if (!Object.keys(getQueue()).length) { setOnline(true); if (enviadas) toast('Alterações offline sincronizadas ✓', 'ok'); }
}
function setOnline(v) {
  const dot = $('#online-dot'); if (!dot) return;
  dot.classList.toggle('off', v === false); dot.classList.toggle('sync', v === 'sync');
  dot.title = v === false ? 'Offline — as alterações ficam na fila' : v === 'sync' ? 'Sincronizando…' : 'Online';
  ui.online = v !== false;
}
window.addEventListener('online', () => { setOnline(true); flushQueue(); });
window.addEventListener('offline', () => setOnline(false));

/* Devolve undefined quando o documento tem a forma errada (um JSON válido mas
 * que não é a lista/objeto esperado). Antes trocava por um vazio, e a próxima
 * gravação automática publicava esse vazio por cima do documento bom — apagando
 * o dado dos três sem deixar rastro. Melhor ignorar e manter o que já havia. */
function normalizeVal(key, val) {
  const def = DEFAULTS[key];
  if (Array.isArray(def)) return Array.isArray(val) ? val : undefined;
  return val && typeof val === 'object' && !Array.isArray(val) ? val : undefined;
}
function loadFromCache() {
  STATE_KEYS.forEach(k => {
    const raw = cache.get(k); if (raw == null) return;
    try { const v = normalizeVal(k, JSON.parse(raw)); if (v !== undefined) state[k] = v; } catch (e) {}
  });
}
/* Estas chaves são um objeto único com a fatia de cada pessoa dentro. Gravar o
 * objeto inteiro fazia a nota de quem salvasse primeiro sumir se o colega
 * salvasse na mesma hora — e às 7h todo mundo escreve a nota do dia ao mesmo
 * tempo. A transação relê o documento e troca só a fatia de quem está salvando,
 * então duas pessoas escrevendo coisas diferentes não se atropelam mais. */
const CHAVES_POR_PESSOA = ['notes', 'diary', 'blocks', 'priorities', 'userPriorities'];
async function salvarMinhaFatia(key) {
  const my = session.user;
  const ref = db.collection(COLLECTION).doc(key);
  await db.runTransaction(async tx => {
    const snap = await tx.get(ref);
    let atual = {};
    if (snap.exists) {
      try { const v = JSON.parse(snap.data().value); if (v && typeof v === 'object' && !Array.isArray(v)) atual = v; } catch (e) {}
    }
    const minha = state[key] ? state[key][my] : undefined;
    if (minha === undefined) delete atual[my]; else atual[my] = minha;
    tx.set(ref, { value: JSON.stringify(atual), updatedAt: Date.now(), updatedBy: my });
    state[key] = atual;
  });
  cache.set(key, JSON.stringify(state[key]));
}
// grava uma chave: cache + Firestore; o render é agendado antes, pra UI responder na hora
async function save(key, msg) {
  scheduleRender();
  let ok;
  if (db && session.user && CHAVES_POR_PESSOA.includes(key)) {
    try { await withTimeout(salvarMinhaFatia(key), 8000); queueRemove(key); setOnline(true); ok = true; }
    catch (e) { ok = await window.storage.set(key, state[key]); }   // transação falhou: caminho normal
  } else ok = await window.storage.set(key, state[key]);
  if (msg) toast(ok ? msg : msg + ' (offline, na fila)', ok ? 'ok' : '');
  return ok;
}

/* =====================================================================
 * 6. TEMPO REAL — onSnapshot na collection inteira. Um doc alterado em
 * outro dispositivo atualiza o state, refaz o cache e agenda UM render
 * (requestAnimationFrame junta várias mudanças seguidas num só).
 * ===================================================================== */
let unsubscribe = null, reconectarTimer = 0;
function subscribe() {
  if (!db || unsubscribe) return;
  ui.firstSnapshot = true;
  unsubscribe = db.collection(COLLECTION).onSnapshot(snap => {
    const doServidor = !snap.metadata.fromCache;
    snap.docChanges().forEach(ch => {
      const key = ch.doc.id;
      if (!STATE_KEYS.includes(key)) return;
      if (ch.type === 'removed') { state[key] = clone(DEFAULTS[key]); return; }
      const raw = ch.doc.data().value;
      let val; try { val = normalizeVal(key, JSON.parse(raw)); } catch (e) { return; }
      if (val === undefined) return;   // documento com forma errada: não encosta no estado
      // hasPendingWrites = eco da nossa própria gravação; não é novidade pra ninguém
      if (!ui.firstSnapshot && !ch.doc.metadata.hasPendingWrites) detectNotifications(key, state[key], val);
      state[key] = val;
      cache.set(key, raw);
    });
    /* A trava de notificação e o "pronto" só abrem no primeiro retorno DO
     * SERVIDOR. Abrir no primeiro retorno qualquer era um problema real: quem
     * abre o app sem sinal recebe primeiro um snapshot vindo do cache, vazio, e
     * o snapshot verdadeiro logo depois chegava com tudo marcado como novo —
     * uma enxurrada de avisos de uma vez. ui.ready também guarda as gravações
     * automáticas (lembretes) até existir dado de servidor em mãos. */
    if (doServidor) { ui.firstSnapshot = false; ui.ready = true; flushQueue(); }
    setOnline(doServidor);
    scheduleRender();
  }, err => {
    console.warn('onSnapshot falhou', err);
    /* O Firestore encerra o ouvinte quando dá erro. Sem zerar a referência e
     * tentar de novo, o app ficava o resto da sessão sem receber nada e mesmo
     * assim continuava gravando por cima de dados que já não conhecia. */
    unsubscribe = null; ui.ready = false; setOnline(false);
    if (ui.firstSnapshot) loadFromCache();   // nunca chegou dado do servidor: cai pro cache
    scheduleRender();
    if (err && err.code === 'permission-denied') toast('Sem permissão para ler os dados. Confira as regras do Firestore.', 'err');
    clearTimeout(reconectarTimer); reconectarTimer = setTimeout(subscribe, 5000);
  });
}
function unsubscribeAll() { clearTimeout(reconectarTimer); if (unsubscribe) { unsubscribe(); unsubscribe = null; } }

/* =====================================================================
 * 7. LOGIN POR PIN
 * pinMap/map = { sha256(pin): email }. A pessoa digita o PIN, o app calcula
 * o hash, descobre o email e entra com senha = PIN + sufixo.
 * ===================================================================== */
const keyFromEmail = email => String(email || '').split('@')[0].toLowerCase();

async function loginWithPin(pin) {
  if (!/^\d{4}$/.test(pin)) throw new Error('O PIN tem 4 dígitos.');
  if (!db) throw new Error('Firebase não carregou. Verifique a conexão.');
  const hash = await sha256(pin);
  const snap = await withTimeout(db.collection('pinMap').doc('map').get(), 10000);
  if (!snap.exists) throw new Error('As contas ainda não foram configuradas.');
  const email = snap.data()[hash];
  if (!email) throw new Error('PIN não encontrado.');
  await auth.signInWithEmailAndPassword(email, pin + PIN_SUFFIX);
}
function startSession(key) {
  session.user = key; lsSet('lg_lastUser', key);
  loadFromCache();          // pinta na hora com o cache...
  subscribe();              // ...e o snapshot corrige em seguida
  if (DEMO) seedDemo();
  hideLogin();
  render();
  requestNotifPermission();
  loadWeather();
  autoLocalizar();   // a equipe viaja: o clima segue quem está na estrada
  maybeCelebrate();
}
async function logout() {
  unsubscribeAll(); closeAllModals();
  session.user = null;
  if (auth) { try { await auth.signOut(); } catch (e) {} }
  showLogin(); render();
}
if (auth) {
  auth.onAuthStateChanged(user => {
    if (user) { const k = keyFromEmail(user.email); if (session.user !== k) startSession(k); }
    else { session.user = null; unsubscribeAll(); showLogin(); render(); }
  });
}

/* Criação de contas usa um app Firebase SECUNDÁRIO: createUser loga
 * automaticamente no app em que foi chamado, e não queremos trocar o
 * usuário do app principal no meio do caminho. */
function secondaryAuth() {
  if (!secondaryApp) secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'secondary');
  return secondaryApp.auth();
}
async function createAccount(email, pin) {
  const sa = secondaryAuth();
  try { await sa.createUserWithEmailAndPassword(email, pin + PIN_SUFFIX); }
  catch (e) { if (e.code !== 'auth/email-already-in-use') throw e; }
  finally { try { await sa.signOut(); } catch (e) {} }
}
// Primeira vez: cria as 3 contas, entra como gestor e grava o pinMap.
async function setupAccounts(pins) {
  for (const [key, pin] of Object.entries(pins)) await createAccount(SEED_EQUIPE[key].email, pin);
  const adminKey = Object.keys(SEED_EQUIPE).find(k => SEED_EQUIPE[k].role === 'admin');
  await auth.signInWithEmailAndPassword(SEED_EQUIPE[adminKey].email, pins[adminKey] + PIN_SUFFIX);
  const map = {};
  for (const [key, pin] of Object.entries(pins)) map[await sha256(pin)] = SEED_EQUIPE[key].email;
  // merge:true — sem isso apagaria o acesso de quem for criado depois pela tela de equipe
  await db.collection('pinMap').doc('map').set(map, { merge: true });
  await db.collection('authSetupDone').doc('done').set({ at: Date.now(), by: adminKey, version: APP_VERSION });
}
// Pessoa nova pela tela de equipe: conta + entrada no pinMap.
async function registerPin(email, pin) {
  await createAccount(email, pin);
  await db.collection('pinMap').doc('map').set({ [await sha256(pin)]: email }, { merge: true });
}
async function changeMyPin(oldPin, newPin) {
  const user = auth.currentUser; if (!user) throw new Error('Sem sessão.');
  const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldPin + PIN_SUFFIX);
  await user.reauthenticateWithCredential(cred);
  await user.updatePassword(newPin + PIN_SUFFIX);
  await db.collection('pinMap').doc('map').set({
    [await sha256(oldPin)]: firebase.firestore.FieldValue.delete(),
    [await sha256(newPin)]: user.email
  }, { merge: true });
}

/* =====================================================================
 * 8. AVISOS — comparamos o que chegou com o que estava no state e avisamos
 * só o que interessa a quem está logado. Quem disparou nunca é avisado: o
 * eco local nem chega aqui, e ainda checamos o autor porque a mesma pessoa
 * pode estar logada em dois aparelhos.
 * ===================================================================== */
function requestNotifPermission() {
  if (!('Notification' in window) || Notification.permission !== 'default') return;
  setTimeout(() => { try { Notification.requestPermission(); } catch (e) {} }, 1500);
}
function notify(title, body) {
  toast(`${title}: ${body}`.slice(0, 120));
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body: String(body || '').slice(0, 200), icon: 'icon-192.svg' }); } catch (e) {}
  }
}
function detectNotifications(key, prev, next) {
  const my = session.user; if (!my) return;
  const idsOf = arr => new Set((arr || []).map(x => x.id));
  if (key === 'messages') {
    const seen = idsOf(prev);
    next.forEach(m => { if (!seen.has(m.id) && m.to === my && m.from !== my) notify(`💬 Mensagem de ${nameOf(m.from)}`, m.text); });
  } else if (key === 'kudos') {
    const seen = idsOf(prev);
    next.forEach(k => { if (!seen.has(k.id) && k.to === my && k.from !== my) notify(`🌟 Elogio de ${nameOf(k.from)}`, k.text); });
  } else if (key === 'requests') {
    const before = new Map((prev || []).map(r => [r.id, r]));
    next.forEach(r => {
      const old = before.get(r.id);
      if (!old && r.status === 'pendente' && r.from !== my && isRecipient(r, my)) notify(`📨 ${reqLabel(r)} de ${nameOf(r.from)}`, r.msg || r.subject || '');
      if (old && old.status === 'pendente' && r.status !== 'pendente' && r.from === my && r.respondedBy !== my)
        notify(`📨 Solicitação ${r.status}`, `${nameOf(r.respondedBy)} ${r.status === 'aceita' ? 'aceitou' : 'recusou'}: ${reqLabel(r)}`);
    });
  } else if (key === 'events') {
    const before = new Map((prev || []).map(e => [e.id, e]));
    next.forEach(ev => {
      const old = before.get(ev.id), mine = involves(ev, my), author = ev.updatedBy || ev.createdBy;
      if (!old) {
        if (mine && author !== my) {
          if (ev.kind === 'reuniao') notify('📞 Convite de reunião', `${ev.title} — ${fmtWD(ev.date)} ${ev.start || ''}`);
          else if (ev.kind === 'tarefa') notify('✅ Nova tarefa atribuída', ev.title);
          else notify('📅 Novo compromisso pra você', `${ev.title} — ${fmtWD(ev.date)}`);
        }
        return;
      }
      const oldTasks = new Set((old.tasks || []).map(t => t.id));
      const newMine = (ev.tasks || []).filter(t => !oldTasks.has(t.id) && t.who === my);
      if (newMine.length && author !== my) notify('✅ Nova tarefa atribuída', `${ev.title}: ${newMine.map(t => t.text || t.role).join(', ')}`);
      const oldC = new Set((old.comments || []).map(c => c.id));
      // canSee: sem isso, uma menção dentro de evento privado avisava quem nem enxerga o evento
      (ev.comments || []).forEach(c => { if (!oldC.has(c.id) && c.by !== my && mentions(c.text, my) && canSee(ev)) notify(`💬 ${nameOf(c.by)} mencionou você`, c.text); });
      if (ev.kind === 'reuniao' && mine && !involves(old, my) && author !== my) notify('📞 Convite de reunião', `${ev.title} — ${fmtWD(ev.date)} ${ev.start || ''}`);
    });
  }
}

function toast(msg, kind = '') {
  const wrap = $('#toast-wrap'); if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg; wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 3200);
}

/* =====================================================================
 * 9. MODAIS — pilha simples. Cada modal tem paint(body) pra se redesenhar
 * quando chega dado novo. Modais com formulário desenham só as partes
 * "vivas", pra não apagar o que a pessoa está digitando.
 * ===================================================================== */
function openModal(opts) {
  const id = opts.id || uid();
  closeModal(id);
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop'; bd.dataset.modal = id;
  bd.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''} ${opts.narrow ? 'narrow' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="flex1"><h2>${opts.title || ''}</h2><div class="sub" ${opts.sub ? '' : 'hidden'}>${opts.sub || ''}</div></div>
    <button class="iconbtn modal-close" data-act="close-modal" aria-label="Fechar">✕</button></div>
    <div class="modal-body"></div></div>`;
  $('#modal-root').appendChild(bd);
  const m = { id, el: bd, body: $('.modal-body', bd), paint: opts.paint || null, live: opts.live !== false,
              onClose: opts.onClose || null, closeOnBackdrop: opts.closeOnBackdrop !== false, data: opts.data || {} };
  ui.modals.push(m);
  document.body.classList.add('modal-open');
  // fecha só no X quando há formulário (closeOnBackdrop:false), pra não perder o que foi digitado
  bd.addEventListener('mousedown', e => { if (e.target === bd && m.closeOnBackdrop) closeModal(id); });
  if (m.paint) m.paint(m.body, m);
  return m;
}
function closeModal(id) {
  const i = ui.modals.findIndex(m => m.id === id); if (i < 0) return;
  const [m] = ui.modals.splice(i, 1); m.el.remove(); if (m.onClose) m.onClose();
  if (!ui.modals.length) document.body.classList.remove('modal-open');
}
function closeAllModals() { [...ui.modals].forEach(m => closeModal(m.id)); }
function getModal(id) { return ui.modals.find(m => m.id === id); }
function repaintModals() { ui.modals.forEach(m => { if (m.live && m.paint) m.paint(m.body, m); }); }
function setModalTitle(id, title, sub) {
  const m = getModal(id); if (!m) return;
  $('h2', m.el).innerHTML = title;
  const s = $('.sub', m.el); if (s) { s.innerHTML = sub || ''; s.hidden = !sub; }
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !ui.modals.length) return;
  const m = ui.modals[ui.modals.length - 1]; if (m.closeOnBackdrop) closeModal(m.id);
});

/* Eventos delegados: data-act (clique), data-change, data-input, data-submit. */
const ACT = {}, CHG = {}, INP = {}, SUB = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault(); // botão dentro de form não pode submeter
  fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('input',  e => { const el = e.target.closest('[data-input]');  if (el && INP[el.dataset.input])  INP[el.dataset.input](el, e); });
document.addEventListener('submit', e => { const el = e.target.closest('[data-submit]'); if (!el) return; e.preventDefault(); if (SUB[el.dataset.submit]) SUB[el.dataset.submit](el, e); });

/* =====================================================================
 * 10. HELPERS DE DOMÍNIO — equipe, eventos, folgas, solicitações
 * ===================================================================== */
function getEquipe() { return state.equipe && Object.keys(state.equipe).length ? state.equipe : SEED_EQUIPE; }
// antes de mexer na equipe, copia a semente pro state (a partir daí, vale o state)

}
/* Quem está desativado não aparece na lista, mas se a tarefa já era dele o
 * navegador escolhia o primeiro ativo e salvar reatribuía a tarefa em silêncio.
 * Aqui a pessoa desativada continua no seletor enquanto for a escolhida. */
function peopleOptions(selected, extra = '') {
  const lista = people();
  if (selected && !lista.includes(selected) && getEquipe()[selected]) lista.unshift(selected);
  return extra + lista.map(k => `<option value="${esc(k)}" ${k === selected ? 'selected' : ''}>${esc(nameOf(k))}${people().includes(k) ? '' : ' (inativo)'}</option>`).join('');
}

// Quem está envolvido num evento: tarefas + participantes; senão o collab.
function eventPeople(ev) {
  const set = new Set();
  (ev.tasks || []).forEach(t => t.who && set.add(t.who));
  (ev.participants || []).forEach(p => p && set.add(p));
  if (!set.size) { if (ev.collab === 'todos') people().forEach(k => set.add(k)); else if (ev.collab) set.add(ev.collab); }
  return [...set];
}
const involves = (ev, key) => !!key && eventPeople(ev).includes(key);
function canSee(ev) { if (!ev.private) return true; return isAdmin() || ev.createdBy === session.user || involves(ev, session.user); }
function matchesSearch(ev) { const q = norm(ui.search.trim()); if (!q) return true; return [ev.title, ev.desc, ev.local].some(f => norm(f).includes(q)); }
/* A busca e o filtro "só os meus" servem às GRADES. As listas de um dia
 * específico precisam mostrar o dia inteiro, senão digitar na busca fazia o
 * modal do dia anunciar "1 compromisso" havendo quatro. */
function permittedEvents() { return (state.events || []).filter(ev => ev && ev.date && canSee(ev)); }
function visibleEvents() { return (state.events || []).filter(ev => ev && ev.date && canSee(ev) && (!ui.onlyMine || involves(ev, session.user)) && matchesSearch(ev)); }
function eventsOn(dateStr, list) { return (list || visibleEvents()).filter(ev => ev.date === dateStr).sort(sortEvents); }
function sortEvents(a, b) {
  if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
  const aa = a.allDay || !a.start, bb = b.allDay || !b.start;
  if (aa !== bb) return aa ? -1 : 1;
  return (a.start || '').localeCompare(b.start || '') || String(a.title).localeCompare(String(b.title));
}
function eventOwner(ev) { const ps = eventPeople(ev); return ps.length === 1 ? ps[0] : 'todos'; }
function eventStyle(ev) {

  const c = safeCor(state.customColors && state.customColors[ev.id]);

}

    if (ev.start && ev.end < ev.start) d.setDate(d.getDate() + 1);

}
function findEvent(id) { return (state.events || []).find(e => e.id === id); }
const isLoad = ev => ev.type !== 'folga' && ev.type !== 'aniversario';   // folga não conta como carga
function weekLoad(who, dateStr, excludeId) {
  const s = ymd(startOfWeek(parseYmd(dateStr))), e = addDaysYmd(s, 6);
  return state.events.filter(ev => ev.id !== excludeId && ev.date >= s && ev.date <= e && isLoad(ev) && involves(ev, who)).length;
}
function monthLoad(who, y, m) {
  const p = `${y}-${pad2(m + 1)}-`;

}
function replacePerson(ev, from, to) {
  (ev.tasks || []).forEach(t => { if (t.who === from) t.who = to; });

  if (ev.participants && !(ev.participants.includes(from) && ev.participants.includes(to)))
    ev.participants = [...new Set(ev.participants.map(p => p === from ? to : p))];

}
// folgas/férias: state.folgas = [{ id, who, tipo:'ferias'|'folga', start, end, periodo }]
function offOn(dateStr) { return (state.folgas || []).filter(f => f.start <= dateStr && dateStr <= f.end); }
function offFor(who, dateStr) { return offOn(dateStr).find(f => f.who === who); }
// o texto vai parar em atributo title, então o período precisa sair escapado
function offLabel(f) { return f.tipo === 'ferias' ? '🏝️ férias' : f.periodo === 'integral' ? '🏖️ folga' : `🌗 folga (${esc(f.periodo)})`; }
// só de quem está na equipe ativa: quem saiu não deve mais puxar bolo e confete
function birthdaysOn(dateStr) { const md = dateStr.slice(5); return Object.entries(state.birthdays || {}).filter(([k, v]) => v === md && people().includes(k)).map(([k]) => k); }
function isRecipient(r, key) { return r.to === key || (r.to === 'todos' && person(key).role === 'admin'); }

function dayStatusOf(key, dateStr) { const s = state.statuses[dateStr] && state.statuses[dateStr][key]; return s && DAY_STATUS[s] ? DAY_STATUS[s] : null; }

/* A linha do tempo rola por dentro. Onde a barra de rolagem ocupa espaço de
 * verdade (Windows, Linux), ela come largura só do corpo, e as colunas de baixo
 * ficavam mais estreitas que as do cabeçalho — a última aparecia amassada.

  const barra = body.offsetWidth - body.clientWidth;
  tl.style.setProperty('--sbw', barra + 'px');
}

/* =====================================================================
 * 11b. CUBOS DO MÊS — adaptação do efeito Cubes do ReactBits (reactbits.dev)
 * para JS puro: a grade recebe perspectiva, cada dia vira um bloco com faces
 * laterais e se inclina conforme a distância até o ponteiro. Sem GSAP: a
 * volta ao lugar é uma transição CSS, e só as células dentro do raio recebem
 * transform, então o custo por quadro é baixo.
 * Ângulo bem menor que o do original (45°), senão o texto do dia fica ilegível.
 * ===================================================================== */
const CUBOS = { maxAngle: 17, radius: 2.3, ringDelay: 55 };
const semMovimento = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const cubesAtivos = () => ui.cubes && !semMovimento();

let cubeRaf = 0, cubeGrid = null;
function ligarCubos(grid) {
  cubeGrid = grid;
  if (!grid || !cubesAtivos() || grid.dataset.cubes) return;
  grid.dataset.cubes = '1';
  grid.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;   // no celular o dedo cobre a célula; inclinar atrapalha
    if (cubeRaf) cancelAnimationFrame(cubeRaf);
    const rect = grid.getBoundingClientRect();
    cubeRaf = requestAnimationFrame(() => inclinarCubos(grid, e.clientX - rect.left, e.clientY - rect.top, rect));
  });
  grid.addEventListener('pointerleave', () => soltarCubos(grid));
  grid.addEventListener('click', e => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    ondaCubos(grid, +cell.dataset.r, +cell.dataset.c);
  });
}
function inclinarCubos(grid, x, y, rect) {
  const cells = $$('.cell', grid); if (!cells.length) return;
  const linhas = Math.ceil(cells.length / 7);
  const larg = rect.width / 7, alt = (rect.height - (grid.firstElementChild ? grid.firstElementChild.offsetHeight : 0)) / linhas;
  const colC = x / larg, rowC = (y - (grid.firstElementChild ? grid.firstElementChild.offsetHeight : 0)) / alt;
  cells.forEach(cell => {
    const dist = Math.hypot(+cell.dataset.r + 0.5 - rowC, +cell.dataset.c + 0.5 - colC);
    if (dist <= CUBOS.radius) {
      const pct = 1 - dist / CUBOS.radius, a = pct * CUBOS.maxAngle;
      cell.classList.add('tilting');
      cell.style.transform = `rotateX(${-a.toFixed(2)}deg) rotateY(${a.toFixed(2)}deg)`;
      cell.style.zIndex = String(2 + Math.round(pct * 8));
    } else if (cell.style.transform) {
      cell.classList.remove('tilting'); cell.style.transform = ''; cell.style.zIndex = '';
    }
  });
}
function soltarCubos(grid) {
  if (cubeRaf) { cancelAnimationFrame(cubeRaf); cubeRaf = 0; }
  $$('.cell', grid).forEach(cell => { cell.classList.remove('tilting'); cell.style.transform = ''; cell.style.zIndex = ''; });
}
// onda: os dias acendem em anéis a partir do dia clicado
function ondaCubos(grid, rowHit, colHit) {
  if (!cubesAtivos()) return;
  $$('.cell', grid).forEach(cell => {
    const anel = Math.round(Math.hypot(+cell.dataset.r - rowHit, +cell.dataset.c - colHit));
    cell.style.setProperty('--ripple-delay', (anel * CUBOS.ringDelay) + 'ms');
    cell.classList.remove('ripple'); void cell.offsetWidth;   // reinicia a animação
    cell.classList.add('ripple');
    setTimeout(() => cell.classList.remove('ripple'), anel * CUBOS.ringDelay + 600);
  });
}
/* =====================================================================
 * 11c. MARCADOR DE PROXIMIDADE NOS BOTÕES DO MENU — cada botão ganha um
 * valor --fx (0 a 1) conforme a distância do ponteiro até o seu centro,
 * suavizado quadro a quadro por interpolação exponencial (não por transição
 * CSS, que ficaria dessincronizada entre vários botões se movendo juntos).
 * O laço de animação só roda enquanto algum valor ainda está se movendo.
 * ===================================================================== */
const MARCADOR = { raio: 95, duracaoMs: 90 };
let marcadorRaf = 0, marcadorUltimoMs = 0;
const marcadorAlvo = new Map(), marcadorAtual = new Map();
function ligarMarcadorMenu() {
  const box = $('.sb-btns'); if (!box || box.dataset.marcador) return;
  box.dataset.marcador = '1';
  box.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' || semMovimento()) return;
    const rect = box.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    $$('.btn', box).forEach(btn => {
      const r = btn.getBoundingClientRect();
      const cx = r.left - rect.left + r.width / 2, cy = r.top - rect.top + r.height / 2;
      const dist = Math.hypot(px - cx, py - cy);
      const p = Math.max(0, 1 - dist / MARCADOR.raio);
      marcadorAlvo.set(btn, p * p * (3 - 2 * p));   // curva suave (smoothstep), sem picos bruscos
    });
    marcadorAnimar();
  });
  box.addEventListener('pointerleave', () => { $$('.btn', box).forEach(btn => marcadorAlvo.set(btn, 0)); marcadorAnimar(); });
}
function marcadorAnimar() {
  if (marcadorRaf) return;
  marcadorUltimoMs = performance.now();
  marcadorRaf = requestAnimationFrame(marcadorQuadro);
}
function marcadorQuadro(agora) {
  const dt = Math.min((agora - marcadorUltimoMs) / 1000, 0.05); marcadorUltimoMs = agora;
  const k = 1 - Math.exp(-dt / (MARCADOR.duracaoMs / 1000));
  let seMovendo = false;
  marcadorAlvo.forEach((alvo, btn) => {
    const cur = marcadorAtual.get(btn) || 0, prox = cur + (alvo - cur) * k;
    const parado = Math.abs(alvo - prox) < 0.002, valor = parado ? alvo : prox;
    marcadorAtual.set(btn, valor);
    btn.style.setProperty('--fx', valor.toFixed(4));
    if (!parado) seMovendo = true;
  });
  marcadorRaf = seMovendo ? requestAnimationFrame(marcadorQuadro) : 0;
}
/* Marcador da nota: uma pastinha. Ao passar o ponteiro pelo dia, ela levanta,
 * a aba da frente inclina e achata, e a folha de dentro sobe e aparece — a
 * mesma mecânica da pasta do reactbits.dev, reduzida ao tamanho de um canto de
 * célula e disparada pelo hover do dia inteiro, que é o alvo fácil de acertar.
 * A cor escolhida na nota pinta a pasta; sem cor, ela usa o cinza da interface. */
function notaMarcador(nota) {
  if (!nota) return '';

function evCard(ev) {
  return `<div class="ev ${eventDone(ev) ? 'done' : ''} ${ev.pinned ? 'pin' : ''}" style="${eventStyle(ev)}" data-act="open-event" data-id="${ev.id}" title="${esc(ev.title)} · ${eventPeople(ev).map(nameOf).join(', ')}">
