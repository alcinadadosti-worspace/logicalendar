function renderTimeline(cols) {
  const start = cols === 7 ? startOfWeek(ui.cursor) : new Date(ui.cursor.getFullYear(), ui.cursor.getMonth(), ui.cursor.getDate());
  const days = Array.from({ length: cols }, (_, i) => ymd(addDays(start, i)));
  const t = todayYmd(), evs = visibleEvents();
  /* A faixa padrão vai das 6h às 22h, que cobre o expediente. Mas um evento às
   * 3h ou às 23h era achatado contra a borda e aparecia na hora errada — uma
   * madrugada desenhada na linha das 6h. Aqui a faixa cresce só o necessário
   * para caber o que existe no período mostrado. */
  let hIni = HOUR_START, hFim = HOUR_END;
  days.forEach(s => eventsOn(s, evs).forEach(ev => {
    if (ev.allDay || !ev.start) return;
    const a = minutesOf(ev.start), b = minutesOf(ev.end || ev.start);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return;   // horário estragado não derruba a grade toda
    hIni = Math.min(hIni, Math.max(0, Math.floor(a / 60)));
    hFim = Math.max(hFim, Math.min(24, Math.ceil(b / 60)));
  }));
  const H = hFim - hIni;
  const head = `<div class="tl-head"><div></div>${days.map(s => { const d = parseYmd(s), hol = isHoliday(s); return `<div class="${s === t ? 'today' : ''}" data-act="open-day" data-date="${s}">${WEEKDAYS[d.getDay()]}<span class="dnum">${d.getDate()}</span>${hol ? `<span class="hol">${esc(hol)}</span>` : ''}</div>`; }).join('')}</div>`;
  const allday = `<div class="tl-allday"><div>dia todo</div>${days.map(s => {
    const items = eventsOn(s, evs).filter(ev => ev.allDay || !ev.start), offs = offOn(s), bds = birthdaysOn(s), nota = minhaNota(s);
    return `<div data-act="open-day" data-date="${s}">${bds.map(k => `<span class="chip">🎂 ${esc(nameOf(k))}</span>`).join('')}${offs.map(f => `<span class="chip" style="${colorVars(f.who)}">${offLabel(f).split(' ')[0]} ${esc(nameOf(f.who))}</span>`).join('')}${nota ? `<span class="chip" ${safeCor(nota.cor) ? `style="--bg:${safeCor(nota.cor)};--fg:${inkFor(safeCor(nota.cor))}"` : ''} title="Sua nota: ${esc(nota.text)}">${esc(nota.icon || '📝')} nota</span>` : ''}${items.map(evCard).join('')}</div>`;
  }).join('')}</div>`;
  const hours = Array.from({ length: H + 1 }, (_, i) => `<div>${pad2((hIni + i) % 24)}:00</div>`).join('');
  const now = new Date(), nowTop = ((now.getHours() * 60 + now.getMinutes()) - hIni * 60) / 60;
  const body = `<div class="tl-body"><div class="tl-hours">${hours}</div>${days.map(s => {
    const placed = layoutTimed(eventsOn(s, evs).filter(ev => !(ev.allDay || !ev.start)));
    return `<div class="tl-col ${s === t ? 'today' : ''}" style="height:calc(var(--hour-h) * ${H + 1})" data-act="open-day" data-date="${s}">
      ${s === t && nowTop >= 0 && nowTop <= H + 1 ? `<div class="tl-now" style="top:calc(var(--hour-h) * ${nowTop.toFixed(3)})"></div>` : ''}
      ${placed.map(({ ev, col, ncol }) => {
        const st = Math.max(0, (minutesOf(ev.start) - hIni * 60) / 60);
        const en = Math.min(H + 1, Math.max(st + 0.5, (minutesOf(ev.end || ev.start) - hIni * 60) / 60));
        if (!Number.isFinite(st) || !Number.isFinite(en)) return '';
        const w = 100 / ncol;
        return `<div class="tl-ev ${eventDone(ev) ? 'done' : ''}" style="${eventStyle(ev)};top:calc(var(--hour-h) * ${st.toFixed(3)});height:calc(var(--hour-h) * ${(en - st).toFixed(3)} - 3px);left:calc(${(col * w).toFixed(2)}% + 3px);width:calc(${w.toFixed(2)}% - 6px)" data-act="open-event" data-id="${ev.id}" title="${esc(ev.title)}"><span class="t">${ev.pinned ? '📌' : typeOf(ev).ico} ${ev.private ? '🔒' : ''}${esc(ev.title)}</span><span class="hh">${ev.start}${ev.end ? '–' + ev.end : ''} · ${eventPeople(ev).map(nameOf).join(', ')}</span></div>`;
      }).join('')}
    </div>`;
  }).join('')}</div>`;
  return `<div class="tl" style="--cols:${cols}" data-hini="${hIni}">${head}${allday}${body}</div>`;
}
// eventos que se sobrepõem no horário ficam lado a lado, em colunas
function layoutTimed(list) {
  const items = list.map(ev => ({ ev, s: minutesOf(ev.start), e: Math.max(minutesOf(ev.start) + 30, minutesOf(ev.end || ev.start)) })).sort((a, b) => a.s - b.s || b.e - a.e);
  const out = []; let cluster = [], clusterEnd = -1;
  const flush = () => {
    if (!cluster.length) return; const cols = [];
    cluster.forEach(it => { let c = cols.findIndex(end => end <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.e; it.col = c; });
    cluster.forEach(it => out.push({ ev: it.ev, col: it.col, ncol: cols.length }));
    cluster = []; clusterEnd = -1;
  };
  items.forEach(it => { if (cluster.length && it.s >= clusterEnd) flush(); cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e); });
  flush(); return out;
}

/* =====================================================================
 * 12. CLIMA — Open-Meteo, sem chave. A equipe é de Penedo (AL), mas viaja:
 * se a pessoa autorizar a localização, o banner mostra o tempo de onde ela
 * está; senão, o da cidade cadastrada. Geocodificação fica em cache pra
 * sempre (não muda) e a previsão por 30 min, por coordenada.
 * ===================================================================== */
/* O Open-Meteo às vezes segura a conexão e devolve 200 com um texto no lugar do
 * JSON ("Unexpected error while streaming data"). Sem corte de tempo, o banner
 * ficava em "carregando…" para sempre — por isso o AbortController e o parse
 * defensivo: qualquer resposta estranha vira um erro tratável. */
async function getJson(url, ms = 12000) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal });
    const txt = await r.text();
    if (r.status === 429) throw new Error('muitas consultas seguidas, tente daqui a pouco');
    if (!r.ok) throw new Error(`serviço fora do ar (${r.status})`);
    try { return JSON.parse(txt); } catch (e) { throw new Error('resposta inválida do serviço'); }
  } catch (e) {
    throw (e && e.name === 'AbortError') ? new Error('demorou demais') : e;
  } finally { clearTimeout(t); }
}
async function geocode(city, uf = UF_OPERACAO) {
  const ck = 'lg_geo_' + norm(city) + '_' + norm(uf), hit = lsGet(ck, null); if (hit) return JSON.parse(hit);
  const j = await getJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=10&language=pt&format=json`);
  const rs = j.results || [];
  // sem filtro, "São Sebastião" cai na Espanha e "Penedo" no Rio de Janeiro
  const g = rs.find(x => x.country_code === 'BR' && norm(x.admin1 || '').includes(norm(uf)))
         || rs.find(x => x.country_code === 'BR') || rs[0];
  if (!g) throw new Error('cidade não encontrada');
  // guarda o nome que pedimos, não o da resposta (Teotônio Vilela volta como "Feira Nova")
  const out = { lat: g.latitude, lon: g.longitude, name: city, admin: g.admin1 || '' };
  lsSet(ck, JSON.stringify(out)); return out;
}
async function fetchWeatherAt(lat, lon, name, admin) {
  const ck = `lg_wx_${lat.toFixed(2)}_${lon.toFixed(2)}`;
  let cache = null; try { cache = JSON.parse(lsGet(ck, 'null')); } catch (e) {}
  const rotular = w => ({ ...w, city: name || w.city, admin: admin || w.admin });
  if (cache && Date.now() - cache.at < 30 * 60e3) return rotular(cache);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`;
  try {
    const j = await getJson(url);
    if (!j.current || !j.daily) throw new Error('resposta incompleta');
    const out = { at: Date.now(), city: name || 'Sua localização', admin: admin || '',
      current: { temp: Math.round(j.current.temperature_2m), code: j.current.weather_code, wind: Math.round(j.current.wind_speed_10m), hum: j.current.relative_humidity_2m },
      daily: j.daily.time.map((d, i) => ({ date: d, code: j.daily.weather_code[i], max: Math.round(j.daily.temperature_2m_max[i]), min: Math.round(j.daily.temperature_2m_min[i]), pop: j.daily.precipitation_probability_max[i] })) };
    lsSet(ck, JSON.stringify(out)); return out;
  } catch (e) {
    // serviço fora do ar: uma leitura velha ainda ajuda mais que "indisponível"
    if (cache) return { ...rotular(cache), velho: true };
    throw e;
  }
}
async function fetchWeather(city, uf) { const g = await geocode(city, uf); return fetchWeatherAt(g.lat, g.lon, g.name, g.admin); }
const wmo = code => WMO[code] || ['🌡️', 'Tempo'];

/* ---------- localização do aparelho ----------
 * Pedida uma única vez por aparelho: quem nega não é incomodado de novo, e
 * quem quiser ligar depois usa o botão nas preferências ou no modal do clima. */
const geoSuportada = () => 'geolocation' in navigator;
function pedirLocalizacao(manual = false) {
  return new Promise(resolve => {
    if (!geoSuportada()) { if (manual) toast('Este navegador não informa a localização', 'err'); return resolve(null); }
    if (!manual && lsGet('lg_geo_negada', '') === '1') return resolve(null);
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      ui.geo = { lat, lon, name: 'Sua localização', admin: '', at: Date.now() };
      lsSet('lg_geo_negada', '0');
      try {
        // nome da cidade onde a pessoa está; se falhar, o clima continua funcionando pelas coordenadas
        const j = await getJson(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`, 8000);
        const adm = (j.localityInfo && j.localityInfo.administrative) || [];
        const municipio = adm.filter(a => a.adminLevel === 8).map(a => a.name)[0];
        ui.geo.name = municipio || j.locality || j.city || 'Sua localização';
        ui.geo.admin = j.principalSubdivision || '';
      } catch (e) {}
      if (manual) toast(`Localização: ${ui.geo.name} ✓`, 'ok');
      loadWeather(); repaintModals(); resolve(ui.geo);
    }, err => {
      if (err.code === 1) lsSet('lg_geo_negada', '1');   // negou: não insiste nas próximas vezes
      if (manual) toast(err.code === 1 ? 'Permissão negada. Libere a localização no navegador.' : 'Não consegui obter a localização', 'err');
      resolve(null);
    }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * 60e3 });
  });
}
async function autoLocalizar() {
  if (!geoSuportada()) return;
  try {
    const p = navigator.permissions && await navigator.permissions.query({ name: 'geolocation' });
    if (p && p.state === 'granted') return void pedirLocalizacao(false);  // já autorizado: nem aparece prompt
    if (p && p.state === 'denied') return;
  } catch (e) {}
  if (lsGet('lg_geo_perguntado', '') === '1') return;   // um pedido por aparelho, e só
  lsSet('lg_geo_perguntado', '1');
  setTimeout(() => pedirLocalizacao(false), 3500);      // depois do pedido de notificação, pra não empilhar
}
/* O login dispara a busca da cidade cadastrada e, segundos depois, a localização
 * dispara outra. A primeira costuma demorar mais (precisa geocodificar) e chegava
 * atrasada, sobrescrevendo a segunda — daí a numeração: só a chamada mais recente
 * pode escrever no banner. O 📍 também é decidido no início, senão a resposta
 * antiga aparece marcada como se fosse a localização. */
let wxSeq = 0;
async function loadWeather() {
  const el = $('#wx-val'); if (!el) return;
  if (!session.user) { el.textContent = '—'; return; }
  const meu = ++wxSeq, geo = ui.geo;
  const cidade = person(session.user).cidade || CIDADES_OPERACAO[0];
  el.textContent = 'carregando…';
  try {
    const w = geo ? await fetchWeatherAt(geo.lat, geo.lon, geo.name, geo.admin) : await fetchWeather(cidade);
    if (meu !== wxSeq) return;   // uma busca mais nova já respondeu: esta ficou velha
    const [ico, lbl] = wmo(w.current.code);
    $('#wx-ico').textContent = ico;
    el.textContent = `${w.current.temp}°C · ${lbl} · ${geo ? '📍 ' : ''}${w.city}${w.velho ? ' (última leitura)' : ''}`;
  } catch (e) { if (meu === wxSeq) el.textContent = 'clima indisponível'; }
}

function expandRecurrence(date, recur, interval, unit, count) {
  const step = recur === 'daily' ? [1, 'days'] : recur === 'weekly' ? [1, 'weeks'] : recur === 'monthly' ? [1, 'months'] : [Math.max(1, interval), unit];
  const out = [], d0 = parseYmd(date);
  for (let i = 0; i < count; i++) {
    let d;
    if (step[1] === 'months') {
      const tg = new Date(d0.getFullYear(), d0.getMonth() + i * step[0], 1);
      d = new Date(tg.getFullYear(), tg.getMonth(), Math.min(d0.getDate(), daysInMonth(tg.getFullYear(), tg.getMonth()))); // dia 31 vira o último dia do mês
    } else d = addDays(d0, i * step[0] * (step[1] === 'weeks' ? 7 : 1));
    out.push(ymd(d));
  }
  return out;
}
SUB['save-event'] = async form => {
  const E = form.elements, m = getModal('day');
  const title = E.title.value.trim(); if (!title) return toast('Dê um título ao evento', 'err');
  const date = E.date.value; if (!date) return toast('Escolha a data', 'err');
  const allDay = E.allDay.checked, start = allDay ? '' : E.start.value, end = allDay ? '' : E.end.value;
  if (!allDay && start && end && end < start) return toast('O fim não pode ser antes do início', 'err');
  const tasks = $$('.task-row', form).map(r => ({ id: uid(), who: $('[name=t_who]', r).value, priority: $('[name=t_prio]', r).value, role: $('[name=t_role]', r).value.trim() || 'Responsável', done: false })).filter(t => t.who);
  if (!tasks.length) return toast('O evento precisa de pelo menos uma tarefa atribuída', 'err');
  const whos = [...new Set(tasks.map(t => t.who))], collab = whos.length === 1 ? whos[0] : 'todos';
  const editId = E.editId.value || null;
  for (const w of whos) { const n = weekLoad(w, date, editId); if (n >= 5 && !confirm(`${nameOf(w)} já tem ${n} compromissos nessa semana. Sobrecarregar mesmo assim?`)) return; }
  const base = { title, date, start, end, allDay, type: E.type.value, local: E.local.value.trim(), link: safeUrl(E.link.value), desc: E.desc.value.trim(),
                 priority: E.priority.value, pinned: E.pinned.checked, private: E.private.checked, collab, tasks, kind: 'evento' };
  const useColor = E.useColor.checked, color = E.color.value;
  if (editId) {
    const ev = findEvent(editId); if (!ev) return toast('Evento não encontrado', 'err');
    // mantém "feito" das tarefas que continuam com a mesma pessoa e função
    base.tasks = base.tasks.map(t => { const old = (ev.tasks || []).find(o => o.who === t.who && (o.role === t.role || o.text === t.role)); return old ? { ...old, priority: t.priority } : t; });
    Object.assign(ev, base, { updatedAt: Date.now(), updatedBy: session.user });
    if (useColor) state.customColors[ev.id] = color; else delete state.customColors[ev.id];
    save('customColors');
    await save('events', 'Evento atualizado ✓'); logHistory('editou', base.private ? `um evento privado em ${fmtDMY(date)}` : `evento "${title}" em ${fmtDMY(date)}`);
  } else {
    const recur = E.recur.value, count = Math.min(60, Math.max(1, Math.floor(Number(E.count.value)) || 1));
    // o formulário é novalidate, então o max=90 do campo não vale: limita aqui
    const intervalo = Math.min(90, Math.max(1, Math.floor(Number(E.interval.value)) || 1));
    const dates = (recur === 'none' ? [date] : expandRecurrence(date, recur, intervalo, E.unit.value, count))
      .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d));   // descarta data inválida vinda de intervalo absurdo
    const seriesId = dates.length > 1 ? uid() : null;
    dates.forEach(dt => {
      const id = uid();
      state.events.push({ ...clone(base), id, date: dt, seriesId, tasks: base.tasks.map(t => ({ ...t, id: uid() })), createdBy: session.user, createdAt: Date.now(), rsvp: {}, comments: [] });
      if (useColor) state.customColors[id] = color;
    });
    if (useColor) save('customColors');
    await save('events', dates.length > 1 ? `${dates.length} eventos criados ✓` : 'Evento criado ✓');
    logHistory('criou', base.private ? `um evento privado em ${fmtDMY(date)}` : `evento "${title}" em ${fmtDMY(date)}${dates.length > 1 ? ` (série de ${dates.length})` : ''}`);
  }
  if (m) m.data.editId = null;
  resetEventForm(form);
};

function vacRange(form) {

async function toggleTask(evId, taskId, done) {
  const ev = findEvent(evId), t = ev && (ev.tasks || []).find(x => x.id === taskId); if (!t) return;
  if (!(isAdmin() || t.who === session.user)) return toast('Só quem recebeu a tarefa pode marcá-la', 'err');
  t.done = !!done; t.doneAt = done ? Date.now() : null; t.doneBy = done ? session.user : null;
  ev.updatedAt = Date.now(); ev.updatedBy = session.user;
  await save('events', done ? 'Tarefa concluída ✓' : 'Tarefa reaberta');
  logHistory(done ? 'concluiu' : 'reabriu', `tarefa "${t.text || t.role}" em "${ev.title}"`);
}

/* =====================================================================
 * 15. SOLICITAÇÕES — troca de dia, substituição, reunião. O destinatário
 * aceita ou recusa; aceitar aplica a mudança no calendário.
 * ===================================================================== */
ACT.requests = () => { if (!session.user) return showLogin(); openModal({ id: 'requests', title: '📨 Solicitações', live: true, paint: paintRequests }); };
function reqDesc(r) {
  if (r.kind === 'troca') return `<b>${esc(nameOf(r.from))}</b> quer trocar o dia <b>${fmtDMY(r.date)}</b> pelo dia <b>${fmtDMY(r.newDate)}</b> de <b>${esc(nameOf(r.to))}</b>`;
  if (r.kind === 'substituicao') { const ev = findEvent(r.eventId); return `<b>${esc(nameOf(r.from))}</b> pede que <b>${esc(nameOf(r.to))}</b> assuma <b>${ev ? esc(ev.title) : 'evento excluído'}</b> em ${fmtDMY(r.date)}`; }
  return `<b>${esc(nameOf(r.from))}</b> solicita reunião com <b>${esc(nameOf(r.to))}</b>: “${esc(r.subject)}” em ${fmtDMY(r.date)} às ${esc(r.time)}`;
}
function paintRequests(body) {
  const my = session.user, all = (state.requests || []).slice().sort((a, b) => b.at - a.at);
  const forMe = all.filter(r => isRecipient(r, my) && r.from !== my), mine = all.filter(r => r.from === my);
  const others = isAdmin() ? all.filter(r => !forMe.includes(r) && !mine.includes(r)) : [];
  const item = (r, canAnswer) => `<div class="req-item"><div class="row"><span class="st ${r.status}">${r.status}</span><span class="muted small">· ${reqLabel(r)} · ${fmtWhen(r.at)}</span></div><div class="mt">${reqDesc(r)}</div>${r.msg ? `<div class="muted small mt">“${esc(r.msg)}”</div>` : ''}${r.status !== 'pendente' && r.respondedBy ? `<div class="hint">${r.status} por ${esc(nameOf(r.respondedBy))} em ${fmtWhen(r.respondedAt)}</div>` : ''}${canAnswer && r.status === 'pendente' ? `<div class="row mt"><button class="btn btn-sm btn-primary" data-act="req-answer" data-id="${r.id}" data-ok="1">✅ Aceitar</button><button class="btn btn-sm" data-act="req-answer" data-id="${r.id}" data-ok="0">❌ Recusar</button></div>` : ''}${r.from === my && r.status === 'pendente' ? `<div class="row mt"><button class="btn btn-xs" data-act="req-cancel" data-id="${r.id}">cancelar pedido</button></div>` : ''}</div>`;
  body.innerHTML = `<div class="section"><h3>Para mim <span class="right muted">${forMe.filter(r => r.status === 'pendente').length} pendente(s)</span></h3>${forMe.map(r => item(r, true)).join('') || '<div class="empty">Nada pra você responder.</div>'}</div>
    <div class="section"><h3>Minhas</h3>${mine.map(r => item(r, false)).join('') || '<div class="empty">Você não fez pedidos.</div>'}</div>
    ${isAdmin() ? `<div class="section"><h3>Entre a equipe</h3>${others.map(r => item(r, true)).join('') || '<div class="empty">Nada entre a equipe.</div>'}</div>` : ''}`;
}
ACT['req-cancel'] = async el => { state.requests = state.requests.filter(r => r.id !== el.dataset.id); await save('requests', 'Pedido cancelado'); };
ACT['req-answer'] = async el => {
  const r = state.requests.find(x => x.id === el.dataset.id); if (!r || r.status !== 'pendente') return;
  const ok = el.dataset.ok === '1', my = session.user;
  // a tela já só mostra os botões para quem pode responder; aqui a regra fica no código
  if (!isAdmin() && !isRecipient(r, my)) return toast('Esse pedido não é seu para responder', 'err');
  // aceitar substituição de um evento que já não existe dizia "aceita" sem fazer nada
  if (ok && r.kind === 'substituicao' && !findEvent(r.eventId)) return toast('O evento não existe mais — recuse este pedido', 'err');
  if (ok) {
    if (r.kind === 'troca') {
      state.events.forEach(ev => {
        if (ev.date === r.date && involves(ev, r.from)) replacePerson(ev, r.from, r.to);
        else if (ev.date === r.newDate && involves(ev, r.to)) replacePerson(ev, r.to, r.from);
      });
      save('events');
    } else if (r.kind === 'substituicao') {
      const ev = findEvent(r.eventId); if (ev) { replacePerson(ev, r.from, r.to); save('events'); }
    } else if (r.kind === 'reuniao') {
      const parts = r.to === 'todos' ? people() : [...new Set([r.from, r.to])];
      const [h, mi] = String(r.time || '10:00').split(':').map(Number); const end = `${pad2(Math.min(23, h + 1))}:${pad2(mi || 0)}`;
      state.events.push({ id: uid(), kind: 'reuniao', type: 'reuniao', title: r.subject, date: r.date, start: r.time, end, allDay: false, participants: parts,
        collab: parts.length === 1 ? parts[0] : 'todos', tasks: [], rsvp: {}, comments: [], priority: 'media', createdBy: my, createdAt: Date.now() });
      save('events');
    }
  }
  r.status = ok ? 'aceita' : 'recusada'; r.respondedBy = my; r.respondedAt = Date.now();
  await save('requests', ok ? 'Solicitação aceita ✓' : 'Solicitação recusada'); logHistory(ok ? 'aceitou' : 'recusou', `${reqLabel(r).toLowerCase()} de ${nameOf(r.from)}`);
};

ACT.messages = el => { if (!session.user) return showLogin(); openMessages(el.dataset.with || null); };
/* A coluna de conversas vinha só da equipe ativa. Se alguém foi desativado com
 * uma mensagem não lida pendente, o badge vermelho ficava para sempre, porque
 * não havia como abrir aquela conversa. Aqui entra também quem já trocou
 * mensagem com você, ativo ou não. */
function pessoasDaConversa() {
  const my = session.user;
  const comHistorico = (state.messages || []).flatMap(m => [m.from, m.to]).filter(k => k && k !== my);
  return [...new Set([...people().filter(k => k !== my), ...comHistorico])];
}
function openMessages(withKey) {
  const my = session.user, others = pessoasDaConversa();
  const w = withKey || others.find(k => (state.messages || []).some(m => m.to === my && m.from === k && !m.read)) || others[0];
  openModal({ id: 'messages', title: '💬 Mensagens', wide: true, live: true, data: { with: w }, paint: paintMessages });
  marcarLidas(w);
}
/* Marcar como lida grava a lista inteira de mensagens, então só pode acontecer
 * quando a pessoa ABRE a conversa — nunca dentro do desenho. O modal é vivo e
 * se redesenha a cada dado que chega: marcar ali fazia o app regravar a lista
 * a cada mensagem recebida, e duas mensagens seguidas do colega viravam uma,
 * porque a confirmação de leitura da primeira subia sem a segunda. */
function marcarLidas(peer) {
  const my = session.user; if (!my || !peer) return;
  let mudou = false;

}
function paintMessages(body, m) {

  const draft = $('#msg-text', body) ? $('#msg-text', body).value : '';
  const thread = msgs.filter(x => (x.from === my && x.to === w) || (x.from === w && x.to === my)).sort((a, b) => a.at - b.at);
  body.innerHTML = `<div class="msg-layout"><div class="msg-people">${pessoasDaConversa().map(k => { const n = msgs.filter(x => x.from === k && x.to === my && !x.read).length; return `<div class="team-item ${k === w ? 'on' : ''}" data-act="msg-with" data-key="${k}">${avatarImg(k, 'avatar sm')}<span class="nm">${esc(nameOf(k))}</span>${n ? `<span class="badge" style="position:static">${n}</span>` : ''}</div>`; }).join('')}</div>
    <div class="msg-thread"><div class="msg-scroll" id="msg-scroll">${thread.length ? thread.map(x => `<div class="bubble ${x.from === my ? 'me' : ''}">${richText(x.text)}<div class="meta">${fmtWhen(x.at)}${x.from === my && x.read ? ' · lida' : ''}</div></div>`).join('') : `<div class="empty">Comece a conversa com ${esc(nameOf(w))}.</div>`}</div>
    <form class="msg-input" data-submit="send-message" data-to="${w}" autocomplete="off"><input class="input" id="msg-text" name="text" maxlength="500" placeholder="Mensagem para ${esc(nameOf(w))}…" value="${esc(draft)}"><button class="btn btn-primary" type="submit">Enviar</button></form></div></div>`;
  const sc = $('#msg-scroll', body); if (sc) sc.scrollTop = sc.scrollHeight;
}
ACT['msg-with'] = el => { const m = getModal('messages'); if (!m) return; m.data.with = el.dataset.key; m.paint(m.body, m); marcarLidas(el.dataset.key); };

function paintInsights(body) {

  const evs = state.events.filter(ev => ev.date && ev.date.startsWith(p) && canSee(ev) && isLoad(ev));

  const perType = Object.entries(EVENT_TYPES).map(([k, t]) => [k, t, evs.filter(ev => ev.type === k).length]).filter(x => x[2] > 0).sort((a, b) => b[2] - a[2]), maxT = Math.max(1, ...perType.map(x => x[2]));
  const perDow = [0, 0, 0, 0, 0, 0, 0]; evs.forEach(ev => perDow[parseYmd(ev.date).getDay()]++); const maxD = Math.max(1, ...perDow);

ACT.weather = () => openModal({ id: 'weather', title: '🌤️ Clima da operação', sub: `${CIDADES_OPERACAO.length} cidades em ${UF_OPERACAO}`, live: false, paint: paintWeather });
// cidades fixas da operação + qualquer cidade cadastrada na equipe que não esteja na lista
function cidadesDoClima() {
  const extras = people().map(k => person(k).cidade).filter(c => c && !CIDADES_OPERACAO.some(x => norm(x) === norm(c)));
  return [...CIDADES_OPERACAO, ...new Set(extras)];
}
async function paintWeather(body) {
  const cards = [], cidades = cidadesDoClima();
  // no dia a dia a pessoa está numa cidade da lista (a equipe é toda de Penedo):
  // nesse caso marca o cartão dela em vez de repetir a mesma cidade duas vezes
  const aqui = ui.geo && cidades.find(c => norm(c) === norm(ui.geo.name));
  if (ui.geo && !aqui) cards.push({ id: 'geo', titulo: '📍 ' + ui.geo.name, geo: true });
  cidades.forEach((c, i) => cards.push({ id: 'c' + i, titulo: (c === aqui ? '📍 ' : '') + c, cidade: c, aqui: c === aqui }));
  body.innerHTML = (ui.geo ? '' : `<div class="warn-box row">📍 Ative a localização para ver o tempo de onde você está quando estiver viajando.<button class="btn btn-sm right" data-act="geo-on">Ativar</button></div>`)
    + cards.map(c => `<div class="wx-card" id="wx-${c.id}"><b>${esc(c.titulo)}</b> <span class="muted small">carregando…</span></div>`).join('');
  // em paralelo: uma cidade lenta não pode segurar a fila das outras
  await Promise.all(cards.map(async c => {
    const el = $('#wx-' + c.id, body); if (!el) return;
    try {
      const w = c.geo ? await fetchWeatherAt(ui.geo.lat, ui.geo.lon, ui.geo.name, ui.geo.admin) : await fetchWeather(c.cidade);
      const [ico, lbl] = wmo(w.current.code);
      const moram = c.geo ? [] : people().filter(k => norm(person(k).cidade) === norm(c.cidade)).map(nameOf);
      const quem = c.geo ? 'você, agora' : [...moram, c.aqui ? 'você está aqui' : ''].filter(Boolean).join(' · ');
      el.innerHTML = `<div class="wx-now"><span class="big">${ico}</span><div><div class="temp">${w.current.temp}°C</div><div class="small">${lbl} · vento ${w.current.wind} km/h · umidade ${w.current.hum}%${w.velho ? ' · <b>última leitura, serviço fora do ar</b>' : ''}</div></div><div class="right small" style="text-align:right"><b>${esc(c.titulo)}</b>${w.admin ? '<br>' + esc(w.admin) : ''}${quem ? '<br><span class="muted">' + esc(quem) + '</span>' : ''}</div></div>
        <div class="wx-days">${w.daily.map(d => { const [i, l] = wmo(d.code); return `<div title="${l}"><span class="i">${i}</span>${WEEKDAYS[parseYmd(d.date).getDay()]}<br><b>${d.max}°</b> ${d.min}°<br>💧${d.pop == null ? '–' : d.pop + '%'}</div>`; }).join('')}</div>`;
    } catch (e) { el.innerHTML = `<b>${esc(c.titulo)}</b> <span class="muted small">não foi possível carregar (${esc(e.message)})</span>`; }
  }));
}

CHG['import-json'] = el => {
  const f = el.files && el.files[0]; if (!f) return; const r = new FileReader();
  r.onload = async () => {
    try {
      const j = JSON.parse(r.result), src = j.state || j, keys = STATE_KEYS.filter(k => k in src);
      if (!keys.length) throw new Error('arquivo sem dados reconhecíveis');
      if (!confirm(`Restaurar ${keys.length} chave(s): ${keys.join(', ')}? Isso substitui os dados atuais.`)) return;
      for (const k of keys) { state[k] = normalizeVal(k, src[k]); await window.storage.set(k, state[k]); }
      render(); toast('Backup restaurado ✓', 'ok'); logHistory('restaurou', `backup de ${j.exportedAt || 'data desconhecida'}`);
    } catch (e) { toast('Backup inválido: ' + e.message, 'err'); }
  };
  r.readAsText(f);
};

/* =====================================================================
 * 23. TELA DE LOGIN (PIN) + configuração inicial das contas
 * ===================================================================== */
let pinBuf = '', loggingIn = false;
function showLogin() {
  const el = $('#login-screen'); el.hidden = false; pinBuf = '';
  const demoPeople = Object.keys(SEED_EQUIPE).concat(people().filter(k => !SEED_EQUIPE[k]));
  el.innerHTML = `<div class="login-card"><img src="logo.png" alt=""><h1>Logística</h1><div class="sub">calendário da equipe</div>
    ${DEMO
      ? `<div class="warn-box" style="text-align:left">Modo demonstração, sem Firebase. Escolha quem você é:</div><div class="demo-people">${demoPeople.map(k => `<button class="btn" data-act="demo-login" data-key="${k}">${avatarImg(k, 'avatar sm')} ${esc(nameOf(k))} <span class="muted small">· ${person(k).role === 'admin' ? 'gestor' : 'equipe'}</span></button>`).join('')}</div>`
      : `<div class="small muted">Digite seu PIN de 4 dígitos</div>
        <div class="pin-boxes" data-act="pin-focus"><span class="on"></span><span></span><span></span><span></span></div>
        <input class="pin-hidden" id="pin-input" type="password" inputmode="numeric" pattern="\\d*" maxlength="4" autocomplete="one-time-code" data-input="pin" aria-label="PIN">
        <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn" data-act="pin-key" data-k="${n}">${n}</button>`).join('')}<button class="btn" data-act="pin-key" data-k="del">⌫</button><button class="btn" data-act="pin-key" data-k="0">0</button><button class="btn btn-primary" data-act="pin-key" data-k="ok">→</button></div>
        <div class="login-msg ${HAS_FIREBASE ? '' : 'err'}" id="login-msg">${HAS_FIREBASE ? '' : 'O Firebase não carregou. Verifique a internet.'}</div>
        <div id="setup-wrap" class="mt"></div>
        `}
    </div>`;
  if (!DEMO && db) checkSetupNeeded();
  setTimeout(() => { const i = $('#pin-input'); if (i) i.focus(); }, 50);
}
function hideLogin() { $('#login-screen').hidden = true; }
function paintPin() {
  $$('.pin-boxes span').forEach((s, i) => { s.textContent = pinBuf[i] ? '•' : ''; s.classList.toggle('on', i === pinBuf.length); });
  const i = $('#pin-input'); if (i && i.value !== pinBuf) i.value = pinBuf;
}
INP.pin = el => { pinBuf = el.value.replace(/\D/g, '').slice(0, 4); paintPin(); if (pinBuf.length === 4) submitPin(); };
ACT['pin-focus'] = () => { const i = $('#pin-input'); if (i) i.focus(); };
ACT['pin-key'] = el => {
  const k = el.dataset.k;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if (k === 'ok') { if (pinBuf.length === 4) submitPin(); return; }
  else if (pinBuf.length < 4) pinBuf += k;
  paintPin(); if (pinBuf.length === 4) submitPin();
};
async function submitPin() {
  if (loggingIn) return; loggingIn = true;
  const msg = $('#login-msg'); msg.className = 'login-msg'; msg.textContent = 'Entrando…';
  try { await loginWithPin(pinBuf); msg.className = 'login-msg ok'; msg.textContent = 'Bem-vindo(a)!'; }
  catch (e) { msg.className = 'login-msg err'; msg.textContent = friendlyAuthError(e); pinBuf = ''; paintPin(); }
  finally { loggingIn = false; }
}
function friendlyAuthError(e) {
  const c = (e && e.code) || '';
  if (e && e.message === 'timeout') return 'Sem resposta do Firebase. Verifique a conexão e, se for a primeira vez, as credenciais.';
  if (['auth/wrong-password', 'auth/invalid-credential', 'auth/user-not-found', 'auth/invalid-login-credentials'].includes(c)) return 'PIN não confere com a conta. Confira o PIN ou fale com o gestor.';
  if (c === 'auth/network-request-failed') return 'Sem conexão. Tente de novo.';
  if (c === 'auth/too-many-requests') return 'Muitas tentativas. Aguarde um pouco.';
  if (c.startsWith('auth/invalid-api-key') || c.startsWith('auth/api-key')) return 'Credenciais do Firebase inválidas (veja SETUP-FIREBASE.md).';
  if (c === 'auth/operation-not-allowed') return 'Ative "E-mail/senha" em Authentication no console do Firebase.';
  return (e && e.message) || 'Erro ao entrar.';
}
async function checkSetupNeeded() {
  try {
    const snap = await withTimeout(db.collection('pinMap').doc('map').get(), 10000); if (snap.exists) return;
    const w = $('#setup-wrap'); if (!w) return;
    w.innerHTML = '<div class="hint mb">Primeira vez aqui? As contas ainda não existem.</div><button class="btn btn-accent" data-act="setup-open">Configurar contas</button>';
  } catch (e) { /* offline ou sem permissão de leitura: não mostra nada */ }
}
ACT['setup-open'] = () => {
  const w = $('#setup-wrap'); if (!w) return;
  w.innerHTML = `<form data-submit="setup-accounts" class="section" style="text-align:left" autocomplete="off"><h3>Definir os PINs</h3><div class="hint mb">Cada pessoa terá um PIN de 4 dígitos, todos diferentes. Anote e passe pra cada um.</div>
    ${Object.entries(SEED_EQUIPE).map(([k, p]) => `<div class="field"><label>${esc(p.nome)} (${p.role === 'admin' ? 'gestor' : 'equipe'})</label><input class="input" name="pin_${k}" inputmode="numeric" maxlength="4" required placeholder="4 dígitos"></div>`).join('')}
    <button class="btn btn-primary btn-block" type="submit">Criar contas e entrar</button></form>`;
};
SUB['setup-accounts'] = async form => {
  const pins = {}; for (const k of Object.keys(SEED_EQUIPE)) pins[k] = form.elements['pin_' + k].value.trim();
  if (Object.values(pins).some(p => !/^\d{4}$/.test(p))) return toast('Todos os PINs precisam ter 4 dígitos', 'err');
  if (new Set(Object.values(pins)).size !== Object.keys(pins).length) return toast('Os PINs precisam ser diferentes entre si', 'err');
  const btn = $('button[type=submit]', form); btn.disabled = true; btn.textContent = 'Criando…';
  try { await setupAccounts(pins); toast('Contas criadas ✓', 'ok'); }
  catch (e) { toast('Erro: ' + friendlyAuthError(e), 'err'); btn.disabled = false; btn.textContent = 'Criar contas e entrar'; }
};
ACT['demo-login'] = el => startSession(el.dataset.key);


/* =====================================================================
 * 24. LEMBRETES — checados a cada 30 s; firedAt sincroniza pra não tocar
 * em dois aparelhos. Se passou da hora com o app fechado, não toca atrasado.
 * ===================================================================== */
function checkReminders() {
  /* ui.ready só é verdadeiro depois que chegou dado do servidor. Sem essa
   * guarda, o tique de 30s podia disparar logo ao abrir o app, ainda com o
   * cache antigo em memória, marcar lembretes vencidos e gravar essa lista
   * velha inteira por cima — apagando tudo o que a equipe tinha criado desde
   * a última vez que aquele aparelho foi usado, sem ninguém clicar em nada. */
  const my = session.user; if (!my || !ui.ready) return; const now = Date.now(); let changed = false;
  (state.reminders || []).forEach(r => {
    if (r.who !== my || r.firedAt) return; const ev = findEvent(r.eventId); if (!ev) return;
    const at = eventStart(ev).getTime() - r.minutes * 60e3;
    // janela curta: um lembrete tocando 25 minutos atrasado só atrapalha
    if (now >= at && now < at + 5 * 60e3) { notify('🔔 Lembrete', `${ev.title} — ${ev.allDay || !ev.start ? fmtWD(ev.date) : ev.start}`); r.firedAt = now; changed = true; }
    else if (now >= at + 5 * 60e3) { r.firedAt = now; changed = true; }
  });
  if (changed) save('reminders');
}

/* =====================================================================
 * 25. FLOCOS E CONFETES em datas festivas (desligável nas preferências)
 * ===================================================================== */
let fxRaf = 0;
function startFx(kind, seconds = 14) {
  const cv = $('#fx'); if (!cv) return; stopFx();
  cv.hidden = false; const g = cv.getContext('2d');
  const resize = () => { cv.width = innerWidth; cv.height = innerHeight; }; resize();
  const colors = ['#3E8FC4', '#BE8B21', '#4F8F52', '#F2B01E', '#23262B'];
  const snowColor = ui.theme === 'dark' ? '#FFFFFF' : '#9AA0A8';
  const ps = Array.from({ length: kind === 'snow' ? 70 : 110 }, () => ({
    x: Math.random() * cv.width, y: Math.random() * -cv.height,
    r: kind === 'snow' ? 2 + Math.random() * 3 : 5 + Math.random() * 5,
    vy: kind === 'snow' ? 0.6 + Math.random() * 1.2 : 1.5 + Math.random() * 2.5,
    vx: (Math.random() - 0.5) * (kind === 'snow' ? 0.6 : 2),
    c: kind === 'snow' ? snowColor : colors[Math.floor(Math.random() * colors.length)], a: Math.random() * Math.PI * 2
  }));
  const until = Date.now() + seconds * 1000;
  const step = () => {
    g.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.y += p.vy; p.x += p.vx + Math.sin(p.a += 0.02) * 0.4;
      if (p.y > cv.height + 10) { p.y = -10; p.x = Math.random() * cv.width; }
      g.fillStyle = p.c;
      if (kind === 'snow') { g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
      else { g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); }
    });
    if (Date.now() < until) fxRaf = requestAnimationFrame(step); else stopFx();
  };
  fxRaf = requestAnimationFrame(step);
}
function stopFx() { cancelAnimationFrame(fxRaf); const cv = $('#fx'); if (cv) { cv.hidden = true; cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); } }
function festiveKind(dateStr) {
  const md = dateStr.slice(5);
  if (md === '12-24' || md === '12-25') return 'snow';
  if (md === '12-31' || md === '01-01') return 'confetti';
  if ((isHoliday(dateStr) || '').startsWith('Carnaval')) return 'confetti';
  if (birthdaysOn(dateStr).length) return 'confetti';
  return null;
}
function maybeCelebrate(force) { if (!ui.festivo) return; const k = festiveKind(todayYmd()); if (k) startFx(k); else if (force) startFx('confetti', 4); }

/* =====================================================================
 * 26. INICIALIZAÇÃO
 * ===================================================================== */
function init() {
  if (DEMO) $('#demo-bar').hidden = false;
  tickClock(); setInterval(tickClock, 1000);
  setInterval(checkReminders, 30000);
  /* A fila offline só era reenviada no evento 'online' do navegador e no
   * primeiro snapshot. Uma conexão lenta, um portal de wi-fi ou uma falha
   * momentânea do Firestore nunca disparam 'online', então a alteração ficava
   * parada até a próxima abertura do app. Aqui ela é tentada de novo sozinha. */
  setInterval(flushQueue, 30000);
  setInterval(() => { if (ui.view !== 'month' && !ui.modals.length) renderView(); }, 60000); // linha do "agora"
  const setTop = () => document.documentElement.style.setProperty('--top-h', ($('#topbar').offsetHeight + (DEMO ? $('#demo-bar').offsetHeight : 0)) + 'px');
  setTop(); window.addEventListener('resize', () => { setTop(); if (innerWidth > 900) toggleDrawer(false); alinharColunas($('.tl')); }); // drawer aberto não pode travar o scroll no desktop
  document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) { const r = $('#search-results'); if (r) r.hidden = true; } });
  ligarMarcadorMenu();   // .sb-btns é HTML fixo, existe desde o primeiro render
  render();
  showLogin(); // onAuthStateChanged esconde se já houver sessão
  if (DEMO) { const last = lsGet('lg_lastUser', ''); if (last && getEquipe()[last]) startSession(last); }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
})();
